# got — codebase architecture, extracted then hand-corrected.
#
# Provenance:
#   git clone --depth 1 https://github.com/sindresorhus/got
#   npx depcruise source --no-config --output-type json > deps.json
#   python3 assets/from_depcruise.py deps.json --root source --zone-depth 2 \
#       --repo-url https://github.com/sindresorhus/got > model.yaml
#
# The nodes, edges, zones and sources below are mechanical. The `kind:`
# values were guessed from filename patterns and then corrected by hand —
# the intended workflow, not a shortcut. `detail:` and the gap edge are human.

