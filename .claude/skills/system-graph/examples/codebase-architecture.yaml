findings:
- id: manual-1
  severity: medium
  kind: boundary-not-modelled
  title: Node core and third-party dependencies are not drawn
  nodes:
  - core_index
  - core_utils_http2_client
  detail: 'dependency-cruiser was run on source/ only, so node:http, node:stream, cacheable-lookup
    and form-data-encoder are invisible here. The diagram therefore shows internal coupling
    honestly and external coupling not at all. Add them as kind: vendor nodes before using
    this to reason about upgrade risk.'
