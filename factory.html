<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShipShape Ticket Factory</title>
<style>
/* ===========================================================================
   system-graph artifact stylesheet
   Every value below comes from the design system in references/design-system.md.
   Do not hand-tune: change the model or the tokens, rebuild.
   =========================================================================== */
*, *::before, *::after { box-sizing: border-box; }
:root {
  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
  --sp-5: 24px; --sp-6: 32px; --sp-7: 48px; --sp-8: 64px;
  --r-sm: 6px; --r-md: 10px; --r-lg: 14px;
  --font: ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --rail: 268px; --panel: 330px;
  --ease: cubic-bezier(.2,.7,.3,1);
}
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--font);
  background: var(--canvas); color: var(--ink);
  font-size: 13px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

/* ------------------------------------------------------------------ chrome */
.app { display: grid; grid-template-rows: auto 1fr;
       grid-template-columns: var(--rail) 1fr var(--panel);
       grid-template-areas: "head head head" "rail canvas panel";
       height: 100%; }
header { grid-area: head; display: flex; align-items: center; gap: var(--sp-4);
  padding: var(--sp-3) var(--sp-5); border-bottom: 1px solid var(--hairline);
  background: var(--surface); }
header h1 { font-size: 14.5px; font-weight: 640; margin: 0; letter-spacing: -.005em; }
header .sub { color: var(--ink-muted); font-size: 12px; }
header .src { font-family: var(--mono); font-size: 10.5px; color: var(--ink-muted);
  border: 1px solid var(--hairline); padding: 3px var(--sp-2); border-radius: var(--r-sm); }
header .spacer { flex: 1; }

.rail  { grid-area: rail;  border-right: 1px solid var(--hairline);
         background: var(--surface); overflow-y: auto; padding: var(--sp-4); }
.panel { grid-area: panel; border-left: 1px solid var(--hairline);
         background: var(--surface); overflow-y: auto; padding: var(--sp-4); }
.canvas { grid-area: canvas; position: relative; overflow: hidden; background: var(--canvas); }

.sec { margin-bottom: var(--sp-6); }
.sec > h2 { font-size: 10px; text-transform: uppercase; letter-spacing: .1em;
  color: var(--ink-muted); font-weight: 620; margin: 0 0 var(--sp-3); }

/* ------------------------------------------------------------- view switch */
.views { display: flex; flex-direction: column; gap: var(--sp-1); }
.views button { display: flex; align-items: baseline; gap: var(--sp-2);
  padding: var(--sp-2) var(--sp-3); border-radius: var(--r-md); text-align: left;
  border: 1px solid transparent; transition: background .12s var(--ease); }
.views button:hover { background: var(--hover); }
.views button[aria-pressed="true"] { background: var(--hover); border-color: var(--hairline); }
.views button[aria-pressed="true"] .vk { color: var(--ink); }
.views .vk { font-weight: 600; font-size: 13px; color: var(--ink-muted); }
.views .vb { font-size: 11px; color: var(--ink-muted); line-height: 1.35; }
.views kbd { margin-left: auto; font-family: var(--mono); font-size: 9.5px;
  color: var(--ink-muted); border: 1px solid var(--hairline); border-radius: 4px;
  padding: 0 4px; }

/* ---------------------------------------------------------------- toggles */
.toggle { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-1) 0;
  cursor: pointer; user-select: none; }
.toggle input { appearance: none; width: 30px; height: 17px; border-radius: 9px;
  background: var(--hairline); position: relative; transition: background .15s var(--ease);
  flex: none; cursor: pointer; }
.toggle input::after { content: ""; position: absolute; top: 2px; left: 2px;
  width: 13px; height: 13px; border-radius: 50%; background: var(--ink);
  transition: transform .15s var(--ease); }
.toggle input:checked { background: var(--acc-transform); }
.toggle input:checked::after { transform: translateX(13px); background: var(--canvas); }
.toggle span { font-size: 12px; }
.toggle .ct { margin-left: auto; font-family: var(--mono); font-size: 10px;
  color: var(--ink-muted); }

/* ----------------------------------------------------------------- legend */
.legend { display: flex; flex-direction: column; gap: 7px; }
.lg { display: flex; align-items: center; gap: var(--sp-2); font-size: 11.5px;
  cursor: pointer; border-radius: var(--r-sm); padding: 2px 3px; }
.lg:hover { background: var(--hover); }
.lg[data-off="1"] { opacity: .38; }
.lg svg { flex: none; }
.lg .nm { font-weight: 560; }
.lg .ds { color: var(--ink-muted); font-size: 10.5px; }

/* ------------------------------------------------------------------ lists */
.item { width: 100%; text-align: left; border: 1px solid var(--hairline);
  border-radius: var(--r-md); padding: var(--sp-3); margin-bottom: var(--sp-2);
  background: var(--canvas); transition: border-color .12s var(--ease); }
.item:hover { border-color: var(--ink-muted); }
.item.on { border-color: var(--acc-transform); }
.item .hd { display: flex; align-items: center; gap: var(--sp-2); margin-bottom: 3px; }
.item .ti { font-weight: 590; font-size: 12.5px; }
.item .bd { color: var(--ink-muted); font-size: 11.5px; line-height: 1.45; }
.chip { font-family: var(--mono); font-size: 9.5px; font-weight: 650;
  padding: 1.5px 6px; border-radius: 999px; border: 1px solid currentColor;
  letter-spacing: .02em; flex: none; }
.chip.hi { color: var(--acc-alert); }
.chip.md { color: var(--acc-gate); }
.chip.lo { color: var(--ink-muted); }
.chip.R  { color: var(--acc-gate); }
.chip.B  { color: var(--acc-release); }
.chip.U  { color: var(--ink-muted); }

.empty { color: var(--ink-muted); font-size: 11.5px; border: 1px dashed var(--hairline);
  border-radius: var(--r-md); padding: var(--sp-3); }

/* -------------------------------------------------------------- inspector */
.insp .kind { font-size: 9.5px; text-transform: uppercase; letter-spacing: .1em;
  font-weight: 650; }
.insp h3 { margin: var(--sp-1) 0 var(--sp-1); font-size: 16px; letter-spacing: -.01em; }
.insp .st { color: var(--ink-muted); font-size: 12px; margin-bottom: var(--sp-4); }
.insp p { font-size: 12px; line-height: 1.55; color: var(--ink-muted); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px var(--sp-3);
  font-size: 11.5px; margin: var(--sp-3) 0; }
.kv dt { color: var(--ink-muted); }
.kv dd { margin: 0; font-family: var(--mono); font-size: 11px; }
.rel { display: flex; flex-direction: column; gap: 3px; margin-top: var(--sp-2); }
.rel button { display: flex; gap: var(--sp-2); align-items: baseline; font-size: 11.5px;
  padding: 3px var(--sp-2); border-radius: var(--r-sm); text-align: left; }
.rel button:hover { background: var(--hover); }
.rel .ar { font-family: var(--mono); color: var(--ink-muted); flex: none; }

/* ----------------------------------------------------------------- canvas */
svg#stage { position: absolute; inset: 0; width: 100%; height: 100%;
  cursor: grab; touch-action: none; }
svg#stage.drag { cursor: grabbing; }
#stage text { pointer-events: none; user-select: none; }
.node, .edge, .zone { transition: opacity .18s var(--ease); }
.dim { opacity: .13; }
.node { cursor: pointer; }
.node .card { transition: filter .15s var(--ease); }
.node:hover .card { filter: brightness(1.14); }
.node.sel .card { filter: brightness(1.14); }
.hidden { display: none; }
.zlabel { font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
  font-weight: 640; }
.elabel { font-size: 10px; font-weight: 560; }
.nkind { font-size: 8.5px; letter-spacing: .09em; text-transform: uppercase; font-weight: 660; }
.ntitle { font-size: 13px; font-weight: 620; letter-spacing: -.005em; }
.nsub { font-size: 10.5px; }
.badge { font-size: 10px; font-weight: 700; }
.loopchip { font-family: var(--mono); font-size: 10px; font-weight: 700; }

.hud { position: absolute; left: var(--sp-4); bottom: var(--sp-4); display: flex;
  gap: var(--sp-1); background: var(--surface); border: 1px solid var(--hairline);
  border-radius: var(--r-md); padding: var(--sp-1); }
.hud button { padding: var(--sp-1) var(--sp-3); border-radius: var(--r-sm);
  font-size: 11.5px; color: var(--ink-muted); }
.hud button:hover { background: var(--hover); color: var(--ink); }
.tip { position: absolute; pointer-events: none; opacity: 0; transition: opacity .1s;
  background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--r-sm);
  padding: var(--sp-2) var(--sp-3); font-size: 11.5px; max-width: 280px;
  box-shadow: 0 6px 22px rgba(0,0,0,.32); z-index: 5; }
.tip.on { opacity: 1; }
.tip b { display: block; font-size: 12px; margin-bottom: 2px; }
.tip span { color: var(--ink-muted); }

@media (max-width: 1180px) {
  .app { grid-template-columns: var(--rail) 1fr; grid-template-areas: "head head" "rail canvas"; }
  .panel { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 id="ttl"></h1>
    <span class="sub" id="sub"></span>
    <span class="spacer"></span>
    <span class="src" id="src"></span>
    <button class="hud" style="position:static;padding:5px 10px" id="theme">Light</button>
  </header>

  <aside class="rail">
    <div class="sec"><h2>Lens</h2><div class="views" id="views"></div></div>
    <div class="sec"><h2>Show</h2><div id="toggles"></div></div>
    <div class="sec"><h2>Stages</h2><div class="legend" id="legNodes"></div></div>
    <div class="sec"><h2>Connections</h2><div class="legend" id="legEdges"></div></div>
  </aside>

  <main class="canvas">
    <svg id="stage"><defs id="defs"></defs><g id="world"></g></svg>
    <div class="hud">
      <button id="fit">Fit</button><button id="zin">+</button>
      <button id="zout">−</button><button id="clr">Clear focus</button>
    </div>
    <div class="tip" id="tip"></div>
  </main>

  <aside class="panel" id="panel"></aside>
</div>

const S = {"meta":{"title":"ShipShape Ticket Factory","subtitle":"Autonomous audit-remediation pipeline \u2014 Linear backlog to merged main, with its self-improvement loops","source":"GAUNTLET/Ship @ 791380a \u2014 scripts/factory/*, .claude/skills/ship-factory + ship-orchestrator","profile":"process"},"tokens":{"meta":{"space":"oklch","generated_by":"assets/palette.py"},"kinds":{"intake":{"hue":264,"shape":"round-tag","meaning":"Where work enters the factory"},"transform":{"hue":152,"shape":"round-rect","meaning":"Work is done / value is added"},"gate":{"hue":82,"shape":"diamond","meaning":"A decision, check, or quality gate"},"store":{"hue":310,"shape":"cylinder","meaning":"Durable state or an artifact at rest"},"release":{"hue":196,"shape":"cut-rect","meaning":"Work leaves the factory"}},"themes":{"dark":{"canvas":"#0e1115","surface":"#171a20","hairline":"#25282e","ink":"#f1f3f9","ink_muted":"#8e929b","alert":{"accent":"#fe8b7f","fill":"#431d1a","text":"#f8edec"},"control":{"accent":"#9fa5b0","fill":"#33353b","text":"#edf0f6"},"external":{"accent":"#71757c","fill":"#1a1c1f","text":"#95989f"},"kinds":{"intake":{"accent":"#8ab0fe","fill":"#1f2a41","text":"#ecf0f9"},"transform":{"accent":"#5fcb82","fill":"#18301f","text":"#ebf3ec"},"gate":{"accent":"#dfa72a","fill":"#35280d","text":"#f4f0e7"},"store":{"accent":"#cd95f5","fill":"#31243b","text":"#f3eef6"},"release":{"accent":"#0bcacc","fill":"#053131","text":"#e7f3f3"}}},"light":{"canvas":"#f8faff","surface":"#ffffff","hairline":"#d8dce5","ink":"#2e3034","ink_muted":"#656971","alert":{"accent":"#c23631","fill":"#ffe6e3","text":"#472522"},"control":{"accent":"#585e68","fill":"#dfe3ea","text":"#2e3034"},"external":{"accent":"#888c94","fill":"#f2f4f9","text":"#585b61"},"kinds":{"intake":{"accent":"#406ac9","fill":"#e4edff","text":"#23304b"},"transform":{"accent":"#018743","fill":"#daf5e0","text":"#1a3823"},"gate":{"accent":"#906800","fill":"#faebcf","text":"#3d2d0d"},"store":{"accent":"#8c51b2","fill":"#f4e7ff","text":"#382944"},"release":{"accent":"#068082","fill":"#cff6f6","text":"#013839"}}}}},"nodes":{"audit":{"id":"audit","label":"Audit findings","kind":"intake","zone":"intake","subtitle":"shipshape-audit \u00b7 68 findings","emits":["finding"],"detail":"The 7-category baseline audit (type safety, bundle, API perf, DB queries,\ntests, error handling, a11y) produced AUDIT_REPORT.md with 68 findings.\nEvery finding became a Linear ticket (TRO-164..239). The 68 number is\nsubmitted and fixed \u2014 CodeRabbit-derived tickets are never counted into it.\n","kindLabel":"intake","metrics":{"fanIn":0,"fanOut":1,"instability":1.0}},"linear":{"id":"linear","label":"Linear backlog","kind":"store","zone":"intake","subtitle":"project ShipShape Audit Remediation","consumes":["finding","new-ticket"],"emits":["ticket"],"detail":"Authoritative for ticket STATUS (the board only shows execution state \u2014\nwhen they disagree, Linear wins and something is wrong). \"In Progress\" is\nthe dispatch lock: the whole batch is reserved before any agent starts,\nor a second worker can pick up a ticket already being fixed in someone\nelse's branch. Scope guardrail: the same workspace holds three unrelated\nprojects; the factory never dispatches outside this one.\n","kindLabel":"store","metrics":{"fanIn":4,"fanOut":1,"instability":0.2},"scc":1},"orch":{"id":"orch","label":"Orchestrator","kind":"control","zone":"dispatch","subtitle":"ship-factory run loop \u00b7 Sonnet","consumes":["ticket"],"detail":"Select \u2192 provision \u2192 dispatch \u2192 gate \u2192 measure \u2192 PR \u2192 triage \u2192 merge.\nOrders by unblock-first, then priority; batches shared root causes\n(DB-4 \u21c4 API-4/5/ERR-7, BUN-1 \u21c4 2/3/4/6) onto one branch. Runs everything\nin parallel except real blockers, same-file collisions, and measurement\nordering (db-query-audit after api-perf-audit). Runs the gate ITSELF \u2014\nan agent reporting green is a claim, not a result. Checkpoints the\nsession between waves: orchestration was ~75% of sprint spend, dominated\nby re-reading context, so no unbroken multi-day sessions.\n","kindLabel":"orchestrator","metrics":{"fanIn":2,"fanOut":4,"instability":0.67},"scc":1},"brief":{"id":"brief","label":"Brief assembly","kind":"transform","zone":"dispatch","subtitle":"contract + lessons + role skill","emits":["brief"],"detail":"The agent contract (domain-blind, non-negotiables: scope, locked\nquarantine, provenance, keep-working) + lessons.md verbatim + the role\nskill(s) routed by finding prefix. Every brief also carries ship-qa's\nregression-test placement rule regardless of category, because the\ngate's regression check can be satisfied by a test the gate never runs.\n","kindLabel":"transform","metrics":{"fanIn":3,"fanOut":1,"instability":0.25},"scc":1},"lessons":{"id":"lessons","label":"lessons.md","kind":"store","zone":"dispatch","subtitle":"standing rules, earned per incident","detail":"The prompt-level self-improvement mechanism. A rule lands here when a\nreview finding recurs on a 2nd ticket \u2014 a defect class recurring means\nthe brief is missing a rule, not that agents need louder restating.\nInjected verbatim into every subsequent brief. Kept short and specific:\nrules that earned their place, not a diary.\n","kindLabel":"store","metrics":{"fanIn":1,"fanOut":1,"instability":0.5},"scc":1},"roles":{"id":"roles","label":"Role skills","kind":"store","zone":"dispatch","subtitle":"ship-frontend \u00b7 ship-backend \u00b7 ship-qa","detail":"Routing table (ship-orchestrator \u00a71): TS-*/BUN-*/A11Y-* \u2192 frontend,\nAPI-*/DB-*/ERR-* \u2192 backend, TEST-* \u2192 qa (plus the package's role skill),\nTF-* \u2192 none yet (escalation gate 2, irreversible infra). Multi-role\ntickets get both briefs \u2014 two briefs is fine, a vague brief is not.\n","kindLabel":"store","metrics":{"fanIn":0,"fanOut":1,"instability":1.0}},"provision":{"id":"provision","label":"worktree.sh","kind":"transform","zone":"build","subtitle":"worktree + DB + ports + .factory-env","detail":"Provisions ../Ship-wt-<ticket>: a git worktree on its own branch, an\nEXCLUSIVE database (DROP/CREATE ship_wt_<ticket> WITH FORCE \u2014 retries\nstart clean, not half-migrated), and ports probed upward from an md5\nstarting point (the hash alone collides ~50% by 36 concurrent tickets).\nWrites .factory-env (exported so DATABASE_URL actually reaches pnpm) and\nnever touches .git/info/exclude \u2014 in a linked worktree .git is a FILE,\nand that write once aborted provisioning before migration under set -e.\n","kindLabel":"transform","metrics":{"fanIn":1,"fanOut":2,"instability":0.67}},"pg":{"id":"pg","label":"ship-audit-pg","kind":"store","zone":"build","subtitle":"one Postgres container \u00b7 :5433","detail":"Docker Postgres holding every worktree's database. Isolation exists\nbecause api/src/test/setup.ts TRUNCATEs 16 tables in beforeAll of every\ntest file \u2014 two agents sharing a database silently destroy each other's\nfixtures and produce failures that look like code defects. The container\nis also the factory's real concurrency ceiling: gates share its\nconnection limit and CPU, so gate runs are staggered even when agent\ndispatch is broad.\n","kindLabel":"store","metrics":{"fanIn":1,"fanOut":1,"instability":0.5}},"agent":{"id":"agent","label":"Coding sub-agent","kind":"transform","zone":"build","subtitle":"Sonnet \u00b7 one ticket, one branch","consumes":["brief"],"emits":["diff"],"detail":"Dispatched on Sonnet (maintainer policy 2026-07-29): the brief carries\nthe knowledge, not the model. By dispatch time it holds the role skill,\nstanding rules, the finding's measured evidence, escalation boundaries,\nand the gate to check itself against \u2014 a well-specified task, not a\nderived one. Model is raised per-ticket only for genuinely open-ended\ncalls (e.g. TRO-197, where the right bundle metric had to be invented).\n","kindLabel":"transform","metrics":{"fanIn":7,"fanOut":1,"instability":0.12},"scc":1},"gate":{"id":"gate","label":"gate.sh","kind":"gate","zone":"verify","subtitle":"G1\u2013G9 \u00b7 mechanical, evidence out","consumes":["diff"],"emits":["gate-verdict","scorecard-row"],"detail":"The cheap-tier eval. G1 typecheck \u00b7 G2 build \u00b7 G3/G4 unit tests vs the\nquarantine baseline (failure IDENTITIES, not counts \u2014 fixing one test\nwhile breaking another keeps totals equal) \u00b7 G5 tests not weakened (net\nadds vs dels; .skip/.todo is an unconditional fail) \u00b7 G6 regression test\nADDED (not just touched) \u00b7 G7 CHANGES.md entry + structural check \u00b7\nG7b recurring review patterns (review-patterns.mjs) \u00b7 G8 diff bounded \u00b7\nG9 CodeRabbit CLI under a hard timeout, never overwriting a real review\nwith a rate-limit stub. New test failures are auto-re-run standalone to\nseparate load noise (TRO-277) from real regressions \u2014 verdict stays\nfail, operator gets the diagnosis free. Writes .factory/gate-result.json,\nwhich becomes the PR body's evidence block.\n","kindLabel":"gate","metrics":{"fanIn":4,"fanOut":5,"instability":0.56},"scc":1},"quarantine":{"id":"quarantine","label":"quarantine.json","kind":"store","zone":"verify","subtitle":"known-failing baseline","detail":"The 13 known-failing web tests (TEST-1/TRO-223). The gate materializes\nit FROM BASE_REF, never from the ticket branch \u2014 reading the branch copy\nwould let an agent append its own failures and pass. The file may only\nshrink: removing genuinely fixed tests is legitimate (reported as\n\"fixed\", informational); widening it to get green is gaming the gate.\n","kindLabel":"store","metrics":{"fanIn":1,"fanOut":1,"instability":0.5},"scc":1},"scorecard":{"id":"scorecard","label":"scorecard.jsonl","kind":"store","zone":"verify","subtitle":"one row per gate run","consumes":["scorecard-row"],"detail":"Appended after EVERY gate run \u2014 pass or fail, including each retry.\nSuccess-only rows would erase failed attempts and the first-attempt-pass\ntrend (the whole point) would read as 100%. cr* fields are filled in at\ntriage.\n","kindLabel":"store","metrics":{"fanIn":1,"fanOut":1,"instability":0.5}},"evals":{"id":"evals","label":"Compare-mode evals","kind":"gate","zone":"verify","subtitle":"vs audit-baseline tag","consumes":["gate-verdict"],"emits":["evidence"],"detail":"The expensive tier: for findings with a measurable target, a compare-mode\nrun of the category audit skill against the audit-baseline git tag\nproves the delta. Cheap categories run per ticket; expensive ones batch\nper category (db-query-audit strictly after api-perf-audit \u2014 statement\nlogging skews timings). A perf or bundle ticket without a measured delta\nis not done; measurable improvement is 40% of the grade.\n","kindLabel":"gate","metrics":{"fanIn":1,"fanOut":2,"instability":0.67},"scc":1},"pr":{"id":"pr","label":"PR + CI","kind":"gate","zone":"ship","subtitle":"GitHub \u00b7 required checks","consumes":["evidence"],"emits":["review-request","green-pr"],"detail":"Push + PR-open is pre-authorized for gate-passed factory branches. The\nPR body IS the evidence (gate JSON, measurement), not a summary; a\nbatched branch lists every ticket it closes. Branch protection on main:\ntypecheck/build/unit, source inventory, CodeQL \u2014 strict, admins bound.\ngh needs GH_REPO=troysatchell/ship because origin's fetch URL is GitLab.\n","kindLabel":"gate","metrics":{"fanIn":1,"fanOut":4,"instability":0.8},"scc":1},"coderabbit":{"id":"coderabbit","label":"CodeRabbit","kind":"external","zone":"ship","subtitle":"reviewer \u00b7 input, never a verdict","consumes":["review-request"],"emits":["review-finding"],"detail":"Reviews every PR (and pre-PR via the CLI in G9). Findings never fail the\ngate on their own \u2014 a reviewer's opinion is input to triage, not a\nverdict. It has caught real bugs: the half-open concurrency race in\nTRO-311's circuit breaker was a genuine critical find.\n","kindLabel":"external","metrics":{"fanIn":1,"fanOut":1,"instability":0.5},"scc":1},"triage":{"id":"triage","label":"Triage","kind":"gate","zone":"ship","subtitle":"fix-now \u00b7 new-ticket \u00b7 dismissed","consumes":["review-finding"],"emits":["disposition","new-ticket"],"detail":"Every finding is classified, none merely received. Fix-now findings get\nfixed and re-reviewed on the branch; ticket-worthy ones are filed to\nLinear automatically (labelled coderabbit, never counted in the 68);\ndismissals need a written reason. A growing dismissed pile in one\ncategory means the factory is talking itself out of real feedback.\n","kindLabel":"gate","metrics":{"fanIn":1,"fanOut":4,"instability":0.8},"scc":1},"ledger":{"id":"ledger","label":"Review ledger","kind":"store","zone":"ship","subtitle":"review-findings.jsonl","consumes":["disposition"],"detail":"Every finding recorded whatever its disposition (review-ledger.mjs).\nExists because fixing findings one at a time and discarding them let a\ndefect class recur on four branches unnoticed on day one. The report's\nrecurrence thresholds drive the two self-improvement loops: 2 tickets \u2192\na lessons.md rule; 3+ tickets \u2192 a mechanical gate.sh check.\n","kindLabel":"store","metrics":{"fanIn":1,"fanOut":2,"instability":0.67},"scc":1},"merge":{"id":"merge","label":"Merge --no-ff","kind":"release","zone":"ship","subtitle":"auto once green \u00b7 policy 2026-07-29","consumes":["green-pr","disposition"],"emits":["merged-main"],"detail":"Standing policy: merges without per-PR confirmation once all four hold \u2014\ngate pass, CI green, every review finding triaged (fix-now ones fixed\nand re-reviewed), no open escalation. --no-ff so branch structure\nsurvives (10% of the grade reads off the git log). Non-ticket content\n(tooling, skills, docs, CI) may merge on gate + CI alone \u2014 but the\nreview still gets read and triaged after the fact. Never merge to clear\na queue.\n","kindLabel":"release","metrics":{"fanIn":2,"fanOut":3,"instability":0.6},"scc":1},"remotes":{"id":"remotes","label":"GitLab + GitHub main","kind":"external","zone":"ship","subtitle":"GitLab is the graded remote","consumes":["merged-main"],"detail":"One push updates both, but origin FETCHES from GitLab while CI, PRs and\nmerges happen on GitHub \u2014 a GitHub merge must be pulled down before the\nnext push or the remotes diverge (verified on PR #1: GitLab was one\ncommit behind). Verify with git ls-remote against both, never assume.\n","kindLabel":"external","metrics":{"fanIn":1,"fanOut":0,"instability":0.0}},"state":{"id":"state","label":"state.mjs","kind":"transform","zone":"observe","subtitle":"derive, never duplicate","emits":["snapshot"],"detail":"Reconstructs live state from sources of truth on every read: worktrees\n+ .factory-env, .factory/gate-result.json, gh pr list, scorecard.jsonl,\nand Claude session transcripts for token cost (list-rate estimate,\nexplicitly NOT billed spend). There is deliberately no status file to\nupdate \u2014 a status file that drifts reads as authoritative while wrong.\n","kindLabel":"transform","metrics":{"fanIn":3,"fanOut":1,"instability":0.25}},"surfaces":{"id":"surfaces","label":"Board surfaces","kind":"release","zone":"observe","subtitle":"serve.mjs :7373 \u00b7 status.mjs \u00b7 board.html","consumes":["snapshot"],"detail":"Two kinds on purpose: OPERATE (serve.mjs rebuilds from live state per\nrequest, free to refresh; status.mjs is the terminal view) and SHARE\n(board.mjs \u2192 board.html, republished as a Claude Artifact at stable URL\nonly at milestones \u2014 a shell script cannot republish an Artifact, so\nevery refresh costs an agent tool call).\n","kindLabel":"release","metrics":{"fanIn":1,"fanOut":1,"instability":0.5}},"maintainer":{"id":"maintainer","label":"Maintainer","kind":"external","zone":"observe","subtitle":"human \u00b7 escalation gates \u00b7 policy","detail":"The factory runs unattended between defined human gates. Escalation\nblocks the TICKET, not the run: questions are held and batched so one\nanswer resumes the factory. Standing policies set here (auto-merg /* ======================================================================== */
/* 1. design tokens -> CSS custom properties                                */
/* ======================================================================== */
function applyTheme(name) {
  const t = S.tokens.themes[name], r = document.documentElement.style;
  r.setProperty('--canvas', t.canvas);
  r.setProperty('--surface', t.surface);
  r.setProperty('--hairline', t.hairline);
  r.setProperty('--ink', t.ink);
  r.setProperty('--ink-muted', t.ink_muted);
  r.setProperty('--hover', name === 'dark' ? 'rgba(255,255,255,.045)' : 'rgba(0,0,0,.035)');
  for (const k of Object.keys(t.kinds)) {
    r.setProperty('--acc-' + k, t.kinds[k].accent);
    r.setProperty('--fill-' + k, t.kinds[k].fill);
  }
  for (const k of ['control', 'external', 'alert']) {
    r.setProperty('--acc-' + k, t[k].accent);
    r.setProperty('--fill-' + k, t[k].fill);
  }
  document.documentElement.dataset.theme = name;
  document.getElementById('theme').textContent = name === 'dark' ? 'Light' : 'Dark';
  ST.theme = name;
}
function pal(kind) {
  const t = S.tokens.themes[ST.theme];
  return t.kinds[kind] || t[kind] || t.control;
}

/* ======================================================================== */
/* 2. state                                                                 */
/* ======================================================================== */
const ST = {
  theme: 'dark',
  view: S.viewOrder[0],
  focus: null,            // node id
  loop: null,             // loop id
  finding: null,
  offKinds: new Set(),
  show: { feedback: true, gaps: true, labels: true, metrics: false },
  tx: 0, ty: 0, k: 1,

/* ======================================================================== */
/* 3. shape language — one silhouette per stage kind                        */
/*    Colour alone never carries category (CVD safety): the outline does too.*/
/* ======================================================================== */
const R = 10;
function cardPath(kind, w, h) {
  const r = R, hr = h / 2;
  switch (kind) {
    case 'intake':   // stadium cap on the LEFT  = work enters here
      return `M ${hr},0 H ${w - r} a${r},${r} 0 0 1 ${r},${r} V ${h - r}
              a${r},${r} 0 0 1 -${r},${r} H ${hr} A ${hr},${hr} 0 0 1 ${hr},0 Z`;
    case 'release':  // stadium cap on the RIGHT = work leaves here
      return `M ${r},0 H ${w - hr} A ${hr},${hr} 0 0 1 ${w - hr},${h} H ${r}
              a${r},${r} 0 0 1 -${r},-${r} V ${r} a${r},${r} 0 0 1 ${r},-${r} Z`;
    case 'gate':     // chevron in, chevron out = flow must pass a check
      return `M 0,0 L 14,${hr} L 0,${h} H ${w - 14} L ${w},${hr} L ${w - 14},0 Z`;
    case 'store':    // cylinder = state at rest
      return `M 16,0 H ${w - r} a${r},${r} 0 0 1 ${r},${r} V ${h - r}
              a${r},${r} 0 0 1 -${r},${r} H 16 A 16,${hr} 0 0 1 16,0 Z`;
    case 'control':  // hexagon = orchestration / routing
      return `M 15,0 H ${w - 15} L ${w},${hr} L ${w - 15},${h} H 15 L 0,${hr} Z`;
    default:         // transform + external = plain process box
      return `M ${r},0 H ${w - r} a${r},${r} 0 0 1 ${r},${r} V ${h - r}
              a${r},${r} 0 0 1 -${r},${r} H ${r} a${r},${r} 0 0 1 -${r},-${r} V ${r}
              a${r},${r} 0 0 1 ${r},-${r} Z`;
  }
}
const PADX = { intake: 34, release: 20, gate: 20, store: 30, control: 20 };
const PADR = { intake: 16, release: 36, gate: 22, store: 16, control: 22 };
function padx(kind) { return PADX[kind] || 16; }
function padr(kind) { return PADR[kind] || 16; }

/* edge visual grammar — one style per relation, applied without exception  */
const EDGE = {
  flow:      { w: 2.4,  dash: '',      head: 'solid', tone: 'ink',      lab: false },
  control:   { w: 1.75, dash: '1 5',   head: 'solid', tone: 'control',  lab: true  },
  data:      { w: 1.75, dash: '',      head: 'open',  tone: 'release',  lab: true  },
  feedback:  { w: 2.25, dash: '7 5',   head: 'solid', tone: 'gate',     lab: true  },
  recursion: { w: 2.25, dash: '2 4',   head: 'solid', tone: 'store',    lab: true  },
  violation: { w: 2.5,  dash: '',      head: 'solid', tone: 'alert',    lab: true  },
  gap:       { w: 2,    dash: '3 6',   head: 'open',  tone: 'alert',    lab: true, ghost: .55 },
};
function edgeColor(kind) {
  const t = S.tokens.themes[ST.theme], s = EDGE[kind] || EDGE.flow;

/* ======================================================================== */
/* 4. svg helpers                                                           */
/* ======================================================================== */
const NS = 'http://www.w3.org/2000/svg';
function el(n, a = {}, kids = []) {
  const e = document.createElementNS(NS, n);
  for (const k in a) if (a[k] != null) e.setAttribute(k, a[k]);
  for (const c of [].concat(kids)) e.appendChild(c);
  return e;
}
function txt(s, a = {}) { const e = el('text', a); e.textContent = s; return e; }
function clip(s, n) { s = String(s == null ? '' : s); return s.length > n ? s.slice(0, n - 1) + '…' : s; }

/* the point half-way ALONG the path, not the middle array index — a label
   pinned to an arbitrary bend point is a label in the wrong place          */
function midpoint(pts) {
  let total = 0; const segs = [];
  for (let i = 1; i < pts.length; i++) {
    const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    segs.push(d); total += d;
  }
  let want = total / 2;
  for (let i = 0; i < segs.length; i++) {
    if (want <= segs[i] || i === segs.length - 1) {
      const t = segs[i] ? want / segs[i] : 0;
      return [pts[i][0] + (pts[i + 1][0] - pts[i][0]) * t,
              pts[i][1] + (pts[i + 1][1] - pts[i][1]) * t];
    }
    want -= segs[i];
  }
  return pts[0];
}

/* An edge that travels a long way backwards is not a semantic return — it is
   the layout wrapping onto the next row. Demote it visually (Tufte: smallest
   effective difference) so the eye does not read it as a feedback path.     */
function isWrap(e, bounds) {
  if (e.route !== 'layer') return false;
  const w = bounds.maxX - bounds.minX;
  return (e.points[0][0] - e.points[e.points.length - 1][0]) > w * 0.28;
}

/* rounded-corner polyline: keeps orthogonal routing readable without the
   hard-corner "circuit board" look that makes bends hard to trace          */
function roundPoly(pts, r = 9) {
  if (pts.length < 3) return pts.map((p, i) => (i ? 'L' : 'M') + p[0] + ',' + p[1]).join(' ');
  let d = `M ${pts[0][0]},${pts[0][1]}`;
  for (let i = 1; i < pts.length - 1; i++) {
    const [px, py] = pts[i - 1], [cx, cy] = pts[i], [nx, ny] = pts[i + 1];
    const d1 = Math.hypot(cx - px, cy - py), d2 = Math.hypot(nx - cx, ny - cy);
    const rr = Math.min(r, d1 / 2, d2 / 2);
    if (rr < 1.5) { d += ` L ${cx},${cy}`; continue; }
    d += ` L ${cx + (px - cx) / d1 * rr},${cy + (py - cy) / d1 * rr}`;
    d += ` Q ${cx},${cy} ${cx + (nx - cx) / d2 * rr},${cy + (ny - cy) / d2 * rr}`;
  }
  const L = pts[pts.length - 1];
  return d + ` L ${L[0]},${L[1]}`;
}

/* 5. render                                                                */
/* ======================================================================== */
const world = document.getElementById('world');
const defs = document.getElementById('defs');

function markers() {
  defs.textContent = '';
  const kinds = Object.keys(EDGE);
  for (const k of kinds) {
    const c = edgeColor(k), st = EDGE[k];
    const head = st.head === 'open'
      ? el('path', { d: 'M1,1 L9,5 L1,9', fill: 'none', stroke: c, 'stroke-width': 1.6,
                     'stroke-linecap': 'round', 'stroke-linejoin': 'round' })
      : el('path', { d: 'M1,1.5 L9.5,5 L1,8.5 Z', fill: c });
    defs.appendChild(el('marker', {
      id: 'a-' + k, viewBox: '0 0 11 10', refX: st.head === 'open' ? 9.5 : 9.8,
      refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse',
      markerUnits: 'userSpaceOnUse',
    }, [head]));

  // soft shadow for the loop / finding chips
  const f = el('filter', { id: 'chipShadow', x: '-40%', y: '-40%', width: '180%', height: '180%' });
  f.appendChild(el('feDropShadow', { dx: 0, dy: 1, stdDeviation: 1.6, 'flood-opacity': .35 }));
  defs.appendChild(f);
}

/* off-page connector: a short stub plus a chip naming the far end.
   dir = +1 leaving the node, -1 arriving at it.                              */
function stub(g, at, toward, farLabel, colour, dir) {
  const t = S.tokens.themes[ST.theme];
  let dx = toward[0] - at[0], dy = toward[1] - at[1];
  const len = Math.hypot(dx, dy) || 1;
  dx /= len; dy /= len;
  const end = [at[0] + dx * 26, at[1] + dy * 26];
  g.appendChild(el('path', {
    d: `M ${at[0]},${at[1]} L ${end[0]},${end[1]}`, stroke: colour,
    'stroke-width': 1.6, 'stroke-linecap': 'round', fill: 'none', opacity: .8,
    'marker-end': dir < 0 ? null : 'url(#a-flow)',
  }));
  const s = (dir > 0 ? '↦ ' : '') + clip(farLabel, 16) + (dir < 0 ? ' ↦' : '');
  const w = 12 + s.length * 5.5;
  const cx = end[0] + dx * (w / 2 + 4), cy = end[1] + dy * 11;
  g.appendChild(el('rect', { x: cx - w / 2, y: cy - 9, width: w, height: 18, rx: 9,
    fill: t.surface, stroke: t.hairline, 'stroke-width': 1 }));
  g.appendChild(txt(s, { x: cx, y: cy + 3.5, class: 'elabel', fill: t.ink_muted,
    'text-anchor': 'middle' }));
}

function view() { return S.views[ST.view]; }

function visibleNode(id) {
  const n = S.nodes[id];

  return true;
}
function visibleEdge(e) {
  if (!ST.show.feedback && (e.kind === 'feedback' || e.kind === 'recursion')) return false;
  if (!ST.show.gaps && e.kind === 'gap') return false;

}

    if (z.note) g.appendChild(txt(clip(z.note, 64), {

    const g = el('g', {
      class: 'edge', 'data-edge': e.id, 'data-from': e.from, 'data-to': e.to,
      'data-loop': e.loop || '', opacity: st.ghost || 1,
    });
    const P = e.points;

    /* A wrapped row's continuation edge is a layout artefact, not a semantic
       long-distance link. Drawn in full it becomes a giant bracket that reads
       as a container. Draw it as an off-page connector instead: a short stub at
       each end, labelled with where it goes. */
    if (wrap) {
      gEdge.appendChild(g);
      stub(g, P[0], P[1] || P[0], S.nodes[e.to].label, c, 1);
      stub(g, P[P.length - 1], P[P.length - 2] || P[0], S.nodes[e.from].label, c, -1);
      continue;
    }
    const d = e.route === 'arc'
      ? `M ${P[0][0]},${P[0][1]} C ${P[1][0]},${P[1][1]} ${P[2][0]},${P[2][1]} ${P[3][0]},${P[3][1]}`
      : roundPoly(P, e.route === 'layer' ? 9 : 14);
    g.appendChild(el('path', { d, fill: 'none', stroke: 'transparent',
      'stroke-width': 14, class: 'hit' }));
    g.appendChild(el('path', {
      d, fill: 'none', stroke: c, 'stroke-width': wrap ? 1.25 : st.w,
      'stroke-dasharray': st.dash || null, 'stroke-linecap': 'round',
      'stroke-linejoin': 'round', 'marker-end': `url(#a-${e.kind || 'flow'})`,
      'vector-effect': 'non-scaling-stroke',
    }));
    (e.route === 'layer' ? gEdge : gLane).appendChild(g);

    /* label / loop chip half-way along the path */
    const showLab = ST.show.labels && st.lab && !wrap;
    const [mx, my] = e.labelAt || midpoint(e.points);
    if (e.loop) {
      const lp = S.loops.find(l => l.id === e.loop);
      const lc = lp && lp.type === 'balancing' ? t.kinds.release.accent
               : lp && lp.type === 'reinforcing' ? t.kinds.gate.accent : t.ink_muted;
      const label = e.loop + (e.polarity ? ' ' + e.polarity : '');
      const w = 16 + label.length * 6.4;
      const cg = el('g', { class: 'edge', 'data-loop': e.loop, 'data-edge': e.id,
                           filter: 'url(#chipShadow)' });
      cg.appendChild(el('rect', { x: mx - w / 2, y: my - 10, width: w, height: 20,
        rx: 10, fill: t.surface, stroke: lc, 'stroke-width': 1.4 }));
      cg.appendChild(txt(label, { x: mx, y: my + 4, class: 'loopchip', fill: lc,
        'text-anchor': 'middle' }));
      gTop.appendChild(cg);
    } else if (showLab && e.label) {
      const s = clip(e.label, 30), w = 12 + s.length * 5.7;
      const cg = el('g', { class: 'edge', 'data-edge': e.id });
      cg.appendChild(el('rect', { x: mx - w / 2, y: my - 9, width: w, height: 18,
        rx: 5, fill: t.surface, stroke: t.hairline, 'stroke-width': 1, opacity: .96 }));
      cg.appendChild(txt(s, { x: mx, y: my + 3.5, class: 'elabel',
        fill: st.tone === 'ink' ? t.ink_muted : c, 'text-anchor': 'middle' }));
      gTop.appendChild(cg);
    }
  }

  /* --- nodes ----------------------------------------------------------- */
  const findingNodes = new Set();
  for (const f of S.findings) for (const n of (f.nodes || [])) findingNodes.add(n);
  /* badge the stages work actually RETURNS to — not every node that happens to
     sit inside some large cycle, which in a real factory is nearly all of them */
  const revisited = new Set(v.edges
    .filter(e => e.kind === 'feedback' || e.kind === 'recursion')
    .map(e => e.to));

  for (const nr of v.nodes) {
    const n = S.nodes[nr.id];
    if (!n || !visibleNode(nr.id)) continue;
    const kind = n.kind || 'transform';
    const c = pal(kind);
    const g = el('g', { class: 'node', 'data-node': nr.id, 'data-kind': kind,
                        transform: `translate(${nr.x},${nr.y})` });
    g.appendChild(el('path', {
      class: 'card', d: cardPath(kind, nr.w, nr.h), fill: c.fill,
      stroke: c.accent, 'stroke-width': 1.5,
      'stroke-dasharray': kind === 'external' ? '4 3' : null,
    }));
    const px = padx(kind), pr = padr(kind);
    const inner = nr.w - px - pr;
    g.appendChild(txt(n.kindLabel || kind, { x: px, y: 17, class: 'nkind', fill: c.accent }));
    g.appendChild(txt(clip(n.label, Math.floor(inner / 7.1)),
      { x: px, y: 36, class: 'ntitle', fill: c.text }));
    if (n.subtitle) g.appendChild(txt(clip(n.subtitle, Math.floor(inner / 5.6)),
      { x: px, y: 54, class: 'nsub', fill: c.text, opacity: .68 }));

    /* badges: work returns here / an open question touches this stage.
       Redundant with the side panels on purpose — the diagram should be
       readable without them. */
    let bx = nr.w - pr;
    if (findingNodes.has(nr.id)) {
      bx -= 15;
      g.appendChild(el('circle', { cx: bx, cy: 13, r: 7.5,
        fill: S.tokens.themes[ST.theme].alert.fill,
        stroke: S.tokens.themes[ST.theme].alert.accent, 'stroke-width': 1.2 }));
      g.appendChild(txt('!', { x: bx, y: 17, class: 'badge',
        fill: S.tokens.themes[ST.theme].alert.accent, 'text-anchor': 'middle' }));
    }
    if (revisited.has(nr.id)) {
      bx -= 17;
      g.appendChild(txt('↻', { x: bx, y: 18, class: 'badge',
        fill: c.accent, 'text-anchor': 'middle' }));
    }
    if (ST.show.metrics && n.metrics) {
      const m = n.metrics;
      g.appendChild(txt(`in ${m.fanIn ?? 0} · out ${m.fanOut ?? 0}` +
        (m.instability != null ? ` · I ${m.instability}` : ''),
        { x: px, y: nr.h + 13, class: 'nsub', fill: S.tokens.themes[ST.theme].ink_muted }));
    }
    gNode.appendChild(g);
  }

  applyFocus();
  fit();
}

/* ======================================================================== */
/* 6. focus — figure/ground, not deletion                                   */
/* ======================================================================== */
function applyFocus() {
  const v = view();
  const keep = new Set();
  if (ST.focus) {
    keep.add(ST.focus);
    for (const e of v.edges) {
      if (e.from === ST.focus) keep.add(e.to);
      if (e.to === ST.focus) keep.add(e.from);
    }
  } else if (ST.loop) {
    const l = S.loops.find(x => x.id === ST.loop);
    if (l) l.members.forEach(m => keep.add(m));
  } else if (ST.finding) {
    const f = S.findings.find(x => x.id === ST.finding);
    if (f) (f.nodes || []).forEach(m => keep.add(m));
  }
  const active = keep.size > 0;
  for (const g of world.querySelectorAll('.node')) {
    const id = g.dataset.node;
    g.classList.toggle('dim', active && !keep.has(id));
    g.classList.toggle('sel', id === ST.focus);
  }
  for (const g of world.querySelectorAll('.edge')) {
    const inLoop = ST.loop && g.dataset.loop === ST.loop;
    const touches = keep.has(g.dataset.from) && keep.has(g.dataset.to) &&
      (!ST.focus || g.dataset.from === ST.focus || g.dataset.to === ST.focus);
    g.classList.toggle('dim', active && !(inLoop || touches));
  }
  for (const g of world.querySelectorAll('.zone')) g.classList.toggle('dim', active);
}

/* ======================================================================== */
/* 7. pan + zoom                                                            */
/* ======================================================================== */
const stage = document.getElementById('stage');
function xform() { world.setAttribute('transform', `translate(${ST.tx},${ST.ty}) scale(${ST.k})`); }
function fit(pad = 40) {
  const b = view().bounds, r = stage.getBoundingClientRect();
  const w = b.maxX - b.minX, h = b.maxY - b.minY;
  ST.k = Math.min((r.width - pad * 2) / w, (r.height - pad * 2) / h, 1.35);
  ST.tx = (r.width - w * ST.k) / 2 - b.minX * ST.k;
  ST.ty = (r.height - h * ST.k) / 2 - b.minY * ST.k;
  xform();
}
function zoomAt(f, cx, cy) {
  const k2 = Math.max(.12, Math.min(4, ST.k * f));
  ST.tx = cx - (cx - ST.tx) * (k2 / ST.k);
  ST.ty = cy - (cy - ST.ty) * (k2 / ST.k);
  ST.k = k2; xform();
}
stage.addEventListener('wheel', ev => {
  ev.preventDefault();
  const r = stage.getBoundingClientRect();
  zoomAt(Math.exp(-ev.deltaY * 0.0016), ev.clientX - r.left, ev.clientY - r.top);
}, { passive: false });
let drag = null;
stage.addEventListener('pointerdown', ev => {
  if (ev.target.closest('.node')) return;
  drag = { x: ev.clientX - ST.tx, y: ev.clientY - ST.ty };
  stage.classList.add('drag'); stage.setPointerCapture(ev.pointerId);
});
stage.addEventListener('pointermove', ev => {
  if (drag) { ST.tx = ev.clientX - drag.x; ST.ty = ev.clientY - drag.y; xform(); }
  const g = ev.target.closest('.node, .edge');
  if (g) showTip(g, ev); else hideTip();
});
addEventListener('pointerup', () => { drag = null; stage.classList.remove('drag'); });
addEventListener('resize', () => fit());

const tip = document.getElementById('tip');
function showTip(g, ev) {
  let b = '', s = '';
  if (g.dataset.node) {
    const n = S.nodes[g.dataset.node];
    b = n.label; s = [n.kind, n.subtitle].filter(Boolean).join(' · ');
  } else {
    const e = view().edges.find(x => x.id === g.dataset.edge);
    if (!e) return hideTip();
    b = `${S.nodes[e.from].label} → ${S.nodes[e.to].label}`;
    s = [e.kind, e.label, e.loop && `loop ${e.loop}`,
         e.confidence === 'heuristic' && 'inferred'].filter(Boolean).join(' · ');
  }
  tip.innerHTML = '';
  const bb = document.createElement('b'); bb.textContent = b;
  const ss = document.createElement('span'); ss.textContent = s;
  tip.append(bb, ss);
  const r = stage.getBoundingClientRect();
  tip.style.left = Math.min(ev.clientX - r.left + 14, r.width - 300) + 'px';
  tip.style.top = (ev.clientY - r.top + 14) + 'px';
  tip.classList.add('on');
}
function hideTip() { tip.classList.remove('on'); }

stage.addEventListener('click', ev => {
  const n = ev.target.closest('.node');
  if (n) { select(n.dataset.node); return; }
  const e = ev.target.closest('.edge');
  if (e && e.dataset.loop) { ST.focus = null; ST.finding = null; ST.loop = e.dataset.loop; }
  else if (!e) { ST.focus = ST.loop = ST.finding = null; }
  applyFocus(); paintPanel();
});

function select(id) { ST.focus = id; ST.loop = null; ST.finding = null; applyFocus(); paintPanel(); }

/* ======================================================================== */
/* 8. panels                                                                */
/* ======================================================================== */
function h(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function sec(title) { const d = h('div', 'sec'); d.appendChild(h('h2', null, title)); return d; }

function paintPanel() {
  const p = document.getElementById('panel');
  p.textContent = '';
  if (ST.focus) p.appendChild(inspector(ST.focus));
  else p.appendChild(overview());
  p.appendChild(loopsPanel());
  p.appendChild(findingsPanel());
}

function isCode() { return S.meta.profile === 'code'; }

function overview() {
  const d = sec('This diagram');
  const a = S.analysis || {};
  const dl = h('dl', 'kv');
  const rows = [[isCode() ? 'Modules' : 'Stages', a.nodeCount],
                [isCode() ? 'Dependencies' : 'Connections', a.edgeCount],
                [isCode() ? 'Cycles' : 'Loops', a.loopCount],
                ['Open questions', a.findingCount]];
  for (const [k, val] of rows) { dl.appendChild(h('dt', null, k)); dl.appendChild(h('dd', null, val ?? '—')); }
  d.appendChild(dl);
  d.appendChild(h('p', null, view().blurb || ''));
  d.appendChild(h('p', null, isCode()
    ? 'Click any module to trace what it depends on and what depends on it.'
    : 'Click any stage to trace its immediate neighbourhood. Click a loop badge to isolate a cycle.'));
  return d;
}

function inspector(id) {
  const n = S.nodes[id], v = view(), c = pal(n.kind || 'transform');
  const d = h('div', 'sec insp');
  const k = h('div', 'kind', n.kindLabel || n.kind || 'transform'); k.style.color = c.accent;
  d.append(k, h('h3', null, n.label));
  if (n.subtitle) d.appendChild(h('div', 'st', n.subtitle));
  if (n.detail) d.appendChild(h('p', null, n.detail));

  const m = n.metrics || {};
  const dl = h('dl', 'kv');
  const rows = [['Zone', (S.zones[n.zone] || {}).label || n.zone || '—'],
                ['Fan-in', m.fanIn ?? '—'], ['Fan-out', m.fanOut ?? '—'],
                ['Instability', m.instability ?? '—']];
  if (n.emits && n.emits.length) rows.push(['Emits', n.emits.join(', ')]);
  if (n.consumes && n.consumes.length) rows.push(['Consumes', n.consumes.join(', ')]);
  if (n.owner) rows.push(['Owner', n.owner]);
  for (const [a, b] of rows) { dl.appendChild(h('dt', null, a)); dl.appendChild(h('dd', null, b)); }
  d.appendChild(dl);

  const ins = v.edges.filter(e => e.to === id), outs = v.edges.filter(e => e.from === id);
  for (const [title, list, arrow, other] of
       [[isCode() ? 'Depended on by' : 'Upstream', ins, '←', 'from'],
        [isCode() ? 'Depends on' : 'Downstream', outs, '→', 'to']]) {
    if (!list.length) continue;
    const s = sec(title), wrap = h('div', 'rel');
    for (const e of list) {
      const b = h('button');
      b.append(h('span', 'ar', arrow));
      const lab = h('span', null, S.nodes[e[other]].label +
        (e.label ? ' · ' + e.label : ''));
      lab.style.color = e.kind === 'flow' ? '' : edgeColor(e.kind);
      b.appendChild(lab);
      b.onclick = () => select(e[other]);
      wrap.appendChild(b);
    }
    s.appendChild(wrap); d.appendChild(s);
  }
  return d;
}

function loopsPanel() {
  const d = sec(`${isCode() ? 'Cycles' : 'Loops'} (${S.loops.length})`);
  if (!S.loops.length) {
    d.appendChild(h('div', 'empty', isCode()
      ? 'No circular dependency anywhere in this graph. Every module can be built, tested and reasoned about on its own.'
      : 'No cycle in this model. For a process that is meant to learn, that is itself a finding — see below.'));
    return d;
  }
  for (const l of S.loops) {
    const b = h('button', 'item' + (ST.loop === l.id ? ' on' : ''));
    const hd = h('div', 'hd');
    const cls = l.type === 'balancing' ? 'B' : l.type === 'reinforcing' ? 'R' : 'U';
    hd.append(h('span', 'chip ' + cls, l.id), h('span', 'ti', l.label));
    b.appendChild(hd);
    b.appendChild(h('div', 'bd',
      (isCode() ? 'Circular dependency. ' :
       l.type === 'reinforcing' ? 'Reinforcing — compounds. ' :
       l.type === 'balancing' ? 'Balancing — seeks a goal. ' :
       'Polarity unlabelled — cannot tell if it converges. ') +
      l.members.map(m => (S.nodes[m] || {}).label || m).join(' → ')));
    b.onclick = () => { ST.loop = ST.loop === l.id ? null : l.id; ST.focus = null; ST.finding = null; applyFocus(); paintPanel(); };
    d.appendChild(b);
  }
  return d;
}

function findingsPanel() {
  const d = sec(`Open questions (${S.findings.length})`);
  if (!S.findings.length) {
    d.appendChild(h('div', 'empty', 'No structural gaps detected.'));
    return d;
  }
  for (const f of S.findings) {
    const b = h('button', 'item' + (ST.finding === f.id ? ' on' : ''));
    const hd = h('div', 'hd');
    const sev = f.severity === 'high' ? 'hi' : f.severity === 'medium' ? 'md' : 'lo';
    hd.append(h('span', 'chip ' + sev, f.severity), h('span', 'ti', f.title));
    b.append(hd, h('div', 'bd', f.detail || ''));
    b.onclick = () => { ST.finding = ST.finding === f.id ? null : f.id; ST.focus = null; ST.loop = null; applyFocus(); paintPanel(); };
    d.appendChild(b);
  }
  return d;
}

/* ======================================================================== */
/* 9. rail                                                                  */
/* ======================================================================== */
function buildRail() {
  const vs = document.getElementById('views');
  S.viewOrder.forEach((id, i) => {
    const v = S.views[id];
    const b = h('button');
    b.setAttribute('aria-pressed', String(id === ST.view));
    const top = h('div'); top.style.display = 'flex'; top.style.width = '100%'; top.style.alignItems = 'baseline';
    top.append(h('span', 'vk', v.label));
    const kb = document.createElement('kbd'); kb.textContent = String(i + 1); top.appendChild(kb);
    b.append(top, h('div', 'vb', v.blurb || ''));
    b.onclick = () => setView(id);
    vs.appendChild(b);
  });

  const tg = document.getElementById('toggles');
  const opts = [['feedback', 'Feedback & recursion'], ['gaps', 'Gaps & missing links'],
                ['labels', 'Edge labels'], ['metrics', 'Coupling metrics']];
  for (const [key, label] of opts) {
    const l = h('label', 'toggle');
    const i = document.createElement('input'); i.type = 'checkbox'; i.checked = ST.show[key];
    i.onchange = () => { ST.show[key] = i.checked; render(); paintPanel(); };
    l.append(i, h('span', null, label));
    tg.appendChild(l);
  }

  buildLegend();
}

/* The legend is generated from what is actually on the canvas, in the vocabulary
   the author used. A legend listing kinds the diagram does not contain is noise;
   a legend saying "transform" when every card says "module" is worse.          */
const KIND_ORDER = ['intake', 'transform', 'gate', 'store', 'release', 'control', 'external'];
const MEANING = {
  process: {
    intake: 'Where work enters', transform: 'Work is done, value is added',
    gate: 'A decision, check, or quality gate', store: 'Durable state or an artifact at rest',
    release: 'Where work leaves', control: 'Routes, schedules, or orchestrates',
    external: 'Outside the boundary — context only',
  },
  code: {
    intake: 'Entry point — requests and events arrive', transform: 'Does the work',
    gate: 'Validates, authorises, or filters', store: 'Persistence, cache, or queue',
    release: 'Public surface — what others consume', control: 'Routes, wires, or schedules',
    external: 'Third-party — outside this codebase',
  },
};
const EDGE_MEANING = {
  process: {
    flow: 'Work moves forward', control: 'Triggers or schedules',
    data: 'Data is read or written', feedback: 'Result returns upstream',
    recursion: 'The stage re-enters itself', violation: 'Breaks a stated rule',
    gap: 'A link that should exist and does not',
  },
  code: {
    flow: 'Depends on / calls', control: 'Registers, wires, or dispatches',
    data: 'Reads or writes shared state', feedback: 'Callback or inversion of control',
    recursion: 'Mutually or self-recursive', violation: 'Breaks the layering contract',
    gap: 'A dependency that should exist and does not',
  },
};

function buildLegend() {
  const prof = MEANING[S.meta.profile] ? S.meta.profile : 'process';
  const ln = document.getElementById('legNodes');
  const le = document.getElementById('legEdges');
  ln.textContent = ''; le.textContent = '';

  const present = new Map();          // canonical kind -> label the author used
  for (const id of Object.keys(S.nodes)) {
    const n = S.nodes[id];
    if (!present.has(n.kind)) present.set(n.kind, n.kindLabel || n.kind);
  }
  for (const k of KIND_ORDER)
    if (present.has(k)) addLegendNode(ln, k, MEANING[prof][k], present.get(k));

  const usedEdges = new Set();
  for (const v of Object.values(S.views))
    for (const e of v.edges) usedEdges.add(e.kind || 'flow');
  for (const k of Object.keys(EDGE))
    if (usedEdges.has(k)) addLegendEdge(le, k, EDGE_MEANING[prof][k]);
}

function addLegendNode(host, kind, desc, label) {
  const row = h('div', 'lg'); row.dataset.kind = kind;
  const c = pal(kind);
  const s = el('svg', { width: 40, height: 20, viewBox: '0 0 40 20' });
  s.appendChild(el('path', { d: cardPath(kind, 40, 20), fill: c.fill, stroke: c.accent,
    'stroke-width': 1.4, 'stroke-dasharray': kind === 'external' ? '3 2' : null }));
  row.appendChild(s);
  const w = h('div');
  const nm = h('div', 'nm', label || kind); nm.style.color = c.accent;
  w.append(nm, h('div', 'ds', desc || ''));
  row.appendChild(w);
  row.onclick = () => {
    ST.offKinds.has(kind) ? ST.offKinds.delete(kind) : ST.offKinds.add(kind);
    row.dataset.off = ST.offKinds.has(kind) ? '1' : '';
    render();
  };
  host.appendChild(row);
}
function addLegendEdge(host, kind, desc) {
  const row = h('div', 'lg');
  const st = EDGE[kind], c = edgeColor(kind);
  const s = el('svg', { width: 40, height: 20, viewBox: '0 0 40 20' });
  s.appendChild(el('path', { d: 'M2,10 H 34', stroke: c, 'stroke-width': st.w,
    'stroke-dasharray': st.dash || null, 'stroke-linecap': 'round',
    'marker-end': `url(#a-${kind})`, opacity: st.ghost || 1, fill: 'none' }));
  row.appendChild(s);
  const w = h('div');
  const nm = h('div', 'nm', kind); nm.style.color = c;
  w.append(nm, h('div', 'ds', desc || ''));
  row.appendChild(w);
  host.appendChild(row);
}

function setView(id) {
  ST.view = id; ST.focus = ST.loop = ST.finding = null;
  for (const b of document.querySelectorAll('#views button'))
    b.setAttribute('aria-pressed', String(b.querySelector('.vk').textContent === S.views[id].label));
  render(); paintPanel();
}

/* ======================================================================== */
/* 10. boot                                                                 */
/* ======================================================================== */
document.getElementById('ttl').textContent = S.meta.title || 'Factory Graph';
document.getElementById('sub').textContent = S.meta.subtitle || '';
document.getElementById('src').textContent = S.meta.source || '';
document.getElementById('theme').onclick = () => {
  applyTheme(ST.theme === 'dark' ? 'light' : 'dark');
  render(); paintPanel(); buildLegend();
};
document.getElementById('fit').onclick = () => fit();
document.getElementById('zin').onclick = () => { const r = stage.getBoundingClientRect(); zoomAt(1.25, r.width / 2, r.height / 2); };
document.getElementById('zout').onclick = () => { const r = stage.getBoundingClientRect(); zoomAt(.8, r.width / 2, r.height / 2); };
document.getElementById('clr').onclick = () => { ST.focus = ST.loop = ST.finding = null; applyFocus(); paintPanel(); };
addEventListener('keydown', ev => {
  if (ev.target.tagName === 'INPUT') return;
  const i = parseInt(ev.key, 10);
  if (i >= 1 && i <= S.viewOrder.length) setView(S.viewOrder[i - 1]);
  else if (ev.key === 'f') { ST.show.feedback = !ST.show.feedback; document.querySelectorAll('#toggles input')[0].checked = ST.show.feedback; render(); }
  else if (ev.key === 'g') { ST.show.gaps = !ST.show.gaps; document.querySelectorAll('#toggles input')[1].checked = ST.show.gaps; render(); }
  else if (ev.key === '0') fit();
  else if (ev.key === 'Escape') { ST.focus = ST.loop = ST.finding = null; applyFocus(); paintPanel(); }
});

applyTheme('dark');
buildRail();
render();
paintPanel();
</script>
</body>
