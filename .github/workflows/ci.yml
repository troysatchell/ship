name: CI

# Assignment rule 4: run on every PR and every commit to the default branch.
# This is also the merge gate the ticket factory depends on — a factory PR is
# not eligible for merge until this is green.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege. Without this key the default GITHUB_TOKEN scope applies, which
# is broader than this workflow needs — it only reads, builds, tests and uploads.
permissions:
  contents: read

env:
  # Unit tests TRUNCATE 16 tables in the beforeAll of every api test file
  # (api/src/test/setup.ts). This database exists only for that purpose.
  CI_DATABASE_URL: postgresql://ship:ship_ci_password@localhost:5432/ship_ci

jobs:
  verify:
    name: typecheck · build · unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        # Pinned to 15-alpine because that is the environment the quarantine
        # baseline in audit/factory/quarantine.json was measured on. Production
        # (Render) runs pg16 — that divergence is a real gap, tracked separately,
        # and deliberately NOT papered over by silently bumping this pin.
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ship
          POSTGRES_PASSWORD: ship_ci_password
          POSTGRES_DB: ship_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # source-code inventory reports commit history depth

      # TF-2 (TRO-235): fails the build if a second AWS Terraform root
      # reappears (e.g. terraform/environments/prod) alongside the flat
      # terraform/ root. Pure bash/grep — no dependencies, so it runs first.
      - name: Guard against a second Terraform root
        run: ./scripts/check-single-tf-root.sh

      # Pinned to a full commit SHA, not a tag: a mutable tag on a third-party
      # action can be repointed at malicious code without the ref changing here.
      # b906aff is the commit behind the v4 annotated tag. actions/* below are
      # GitHub-owned and are not subject to this rule.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.27.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared (api and web both depend on its dist)
        run: pnpm build:shared

      - name: Type check
        run: pnpm type-check

      # TRO-211 (TS-6): `pnpm lint` now runs a real flat ESLint config
      # (`eslint.config.mjs`) over `api/src`, `web/src`, `shared/src` instead of
      # silently matching zero package scripts. Error-level rules today are
      # `eqeqeq`, `no-fallthrough`, and the two type-aware promise-correctness
      # rules are WARN (not error) pending a dedicated burn-down — see
      # eslint.config.mjs and CHANGES.md for the counts and rationale.
      - name: Lint
        run: pnpm lint

      - name: Build all packages
        run: pnpm build

      - name: Migrate CI database
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
        run: pnpm db:migrate

      # NOTE: --outputFile must be ABSOLUTE. `pnpm --filter` runs vitest with cwd
      # set to the package directory, so a relative path lands at api/api-tests.json
      # and the regression check below cannot find it.
      - name: API unit tests
        # continue-on-error mirrors the web step: without it a single api failure
        # skips every later step, so the regression check never runs and CI tells
        # you it broke but not WHICH test. The regression check below is the gate
        # for both packages — it fails the job on any new failure.
        continue-on-error: true
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          NODE_ENV: test
        run: pnpm --filter @ship/api test --reporter=json --outputFile="$GITHUB_WORKSPACE/api-tests.json"

      - name: Web unit tests
        # continue-on-error: web has 13 known failures (TEST-1 / TRO-223). The
        # regression check below is the real gate — it fails only on NEW breakage.
        continue-on-error: true
        run: pnpm --filter @ship/web test --reporter=json --outputFile="$GITHUB_WORKSPACE/web-tests.json"

      - name: Check for test regressions vs quarantine baseline
        run: |
          node scripts/factory/lib/testdiff.mjs \
            --package api --current api-tests.json \
            --baseline audit/factory/quarantine.json --repo-root "$PWD"
          node scripts/factory/lib/testdiff.mjs \
            --package web --current web-tests.json \
            --baseline audit/factory/quarantine.json --repo-root "$PWD"

      # TRO-244 (assignment rule 4, "coverage"). Run as separate steps from
      # "API/web unit tests" above rather than folding `--coverage` into those
      # (vitest supports both flags in one invocation) so that a coverage
      # THRESHOLD failure (api/vitest.config.ts, web/vitest.config.ts) is not
      # silently swallowed by those steps' `continue-on-error: true` — a
      # regression here must actually fail this job, not just get logged.
      - name: API test coverage
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          NODE_ENV: test
        run: pnpm --filter @ship/api test:coverage

      - name: Web test coverage
        run: pnpm --filter @ship/web test:coverage

      # TRO-229 (TEST-7 remainder): shared/ had zero test files and no test
      # script before this ticket, so — unlike api/web — there is no
      # quarantine baseline and no separate continue-on-error unit-test step
      # to keep this isolated from. `test:coverage` both runs the suite and
      # enforces shared/vitest.config.ts's threshold in one step; either kind
      # of failure should genuinely fail this job, same as the reasoning
      # above for why coverage runs as its own step for api/web.
      - name: Shared test coverage
        run: pnpm --filter @ship/shared test:coverage

      - name: Coverage summary
        # Runs even if a threshold failed above, so the actual percentages are
        # still visible in the job summary rather than only "it failed."
        if: always()
        run: |
          node scripts/factory/lib/coverage-summary.mjs \
            --pkg api:api/coverage/coverage-summary.json:43 \
            --pkg web:web/coverage/coverage-summary.json:20 \
            --pkg shared:shared/coverage/coverage-summary.json:95

      # TRO-244 (assignment rule 4, "dependency audit (pnpm audit)"). `pnpm
      # audit` alone exits non-zero on ANY finding, including the 135
      # pre-existing ones this repo inherited (see
      # audit/factory/dependency-audit-baseline.json and CHANGES.md) — that
      # exit code is deliberately NOT the gate here; the diff script's own
      # exit code is. GitHub Actions' default shell for `run:` is already
      # `bash -e {0}` (confirmed in this job's own log output) — `|| true`
      # on the pnpm audit line is required, not optional, or `-e` (inherited,
      # not something a bare `set -uo pipefail` here would turn off) aborts
      # the step the instant `pnpm audit` hits its always-true nonzero exit,
      # before the diff script ever runs. Same idiom the `inventory` job
      # already uses above for its own known-can-fail commands.
      - name: Dependency audit (pnpm audit) — baseline diff
        run: |
          set -uo pipefail
          pnpm audit --json > pnpm-audit-current.json || true
          node scripts/factory/lib/dependency-audit-diff.mjs \
            --current pnpm-audit-current.json \
            --baseline audit/factory/dependency-audit-baseline.json

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.sha }}
          path: |
            api-tests.json
            web-tests.json
          retention-days: 14

      - name: Upload coverage + audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-and-audit-${{ github.sha }}
          path: |
            api/coverage/coverage-summary.json
            web/coverage/coverage-summary.json
            shared/coverage/coverage-summary.json
            pnpm-audit-current.json
          if-no-files-found: warn
          retention-days: 14

  inventory:
    name: source-code inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pinned to a full commit SHA, not a tag: a mutable tag on a third-party
      # action can be repointed at malicious code without the ref changing here.
      # b906aff is the commit behind the v4 annotated tag. actions/* below are
      # GitHub-owned and are not subject to this rule.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.27.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Assignment rule 4 requires the pipeline to produce an inventory of the
      # source code it built. Tagged with the git SHA so an artifact can always
      # be traced back to the exact tree that produced it (rule 5).
      - name: Generate inventory
        run: |
          set -euo pipefail
          mkdir -p inventory
          {
            echo "# Source-code inventory"
            echo
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- ref: \`${GITHUB_REF}\`"
            echo "- built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- total commits: $(git rev-list --count HEAD)"
            echo
            echo "## Source files by package"
            echo
            echo "| Package | Files | Lines |"
            echo "|---|---:|---:|"
            for p in api web shared e2e; do
              [ -d "$p" ] || continue
              # `grep` exits 1 on zero matches, which aborts the whole step under
              # `set -e -o pipefail`. `xargs -r` avoids wc reading stdin when the
              # list is empty. A package with no source files must report 0, not
              # kill the job.
              list=$(git ls-files "$p" | grep -E '\.(ts|tsx|js|jsx|sql)$' || true)
              files=$(printf '%s' "$list" | grep -c . || true)
              lines=$(printf '%s\n' "$list" | xargs -r wc -l 2>/dev/null | tail -1 | awk '{print $1}')
              echo "| $p | ${files:-0} | ${lines:-0} |"
            done
            echo
            echo "## Direct dependencies"
            echo
            echo '```'
            pnpm list --depth 0 --recursive 2>/dev/null || true
            echo '```'
            echo
            echo "## Licenses"
            echo
            echo '```'
            pnpm licenses list --prod 2>/dev/null | head -200 || echo "(pnpm licenses unavailable)"
            echo '```'
          } > inventory/INVENTORY-${GITHUB_SHA}.md
          echo "--- generated ---"
          head -30 inventory/INVENTORY-${GITHUB_SHA}.md

      - name: Upload inventory
        uses: actions/upload-artifact@v4
        with:
          name: source-inventory-${{ github.sha }}
          path: inventory/
          retention-days: 90

  codeql:
    name: security scan (CodeQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Assignment rule 4's "security scan" check. CodeQL is GitHub-native — no
    # external service, no credential to provision — and is the standard
    # choice for a TS/JS repo. Independent of `verify`: it's static analysis
    # of source, not something that needs the built/tested artifact, so it
    # runs in parallel rather than waiting.
    #
    # Job-level `permissions:` REPLACES the workflow default for this job, not
    # additive — `contents: read` must be restated alongside the
    # `security-events: write` this job alone needs to upload SARIF results.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      # Pinned to a full commit SHA, not the mutable `v3` tag: a mutable tag on
      # a third-party action can be repointed at malicious code without the
      # ref changing here. a2983b8 is the commit behind the v3.37.4 release
      # tag (resolved via `gh api repos/github/codeql-action/git/refs/tags/v3.37.4`
      # on 2026-07-31). actions/* elsewhere in this file are GitHub-owned and
      # are not subject to this rule; github/codeql-action is third-party by
      # this convention despite living under the github org.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@a2983b8bed1923f44751c5c43237f479442827b3 # v3.37.4
        with:
          # javascript-typescript is the current combined identifier — it
          # analyzes both languages together, not "javascript" alone (which
          # would still cover TS, but the combined name is the documented,
          # explicit spelling for a repo that is TS-first).
          languages: javascript-typescript
          # JS/TS is interpreted: no compilation step is needed to extract a
          # CodeQL database, so `none` is the correct build mode (`autobuild`
          # is for compiled languages only, per github/codeql-action's own
          # README) and is the fastest/simplest option that still fully
          # analyzes web/, api/, shared/, and e2e/.
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@a2983b8bed1923f44751c5c43237f479442827b3 # v3.37.4
        with:
          category: '/language:javascript-typescript'

  build-image:
    name: build · push image (GHCR)
    runs-on: ubuntu-latest
    # Assignment rule 5: build once, promote the artifact. This job builds the
    # SAME root Dockerfile `verify` already proved buildable-and-tested code goes
    # into (TRO-242 made the image build from source), and never rebuilds it
    # again downstream — Render is switched (TRO-246, tracked separately; see
    # docs/deployment-artifact-lifecycle.md) to deploy the exact image pushed
    # here, by digest-stable SHA tag, instead of building its own from the repo.
    # `needs: verify` so a doomed PR/commit never spends minutes on a docker
    # build, and so main never pushes an image for code that failed its own gate.
    needs: verify
    timeout-minutes: 20

    # Job-level `permissions:` REPLACES the workflow default for this job, it
    # does not add to it — so `contents: read` must be restated alongside the
    # `packages: write` this job alone needs to push to GHCR.
    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/troysatchell/ship
      # True only for an actual push to main. Never for a pull_request — even
      # one opened against main — and never for a workflow_dispatch run against
      # some other branch. PR runs still build (below), unauthenticated and
      # without pushing, to prove the Dockerfile a change touched stays
      # buildable from a clean checkout; that's the whole value of this job
      # running on PRs at all, since nothing there is promoted anywhere.
      SHOULD_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Only authenticate when we're actually about to push. A fork PR's
      # GITHUB_TOKEN has no write scope regardless of the permissions block
      # above (GitHub enforces that for forked-repo runs), so this would fail
      # there anyway — skipping it is also what keeps a PR run from needing
      # any registry credential at all.
      - name: Log in to GHCR
        if: env.SHOULD_PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The SHA tag alone is always valid. The branch tag is only added when we
      # are actually pushing (main only): `github.ref_name` is safe there
      # ("main"), but for a `pull_request` event it resolves to something like
      # `42/merge` — a slash, which is not a legal Docker tag — and Docker
      # rejects the whole `-t` list even though push is false. Computing the
      # list in a step keeps that invalid string out of build-push-action's
      # `tags:` input entirely instead of relying on push:false to make it
      # harmless.
      - name: Compute image tags
        id: tags
        run: |
          set -euo pipefail
          TAGS="${IMAGE}:${GITHUB_SHA}"
          if [ "${SHOULD_PUSH}" = "true" ]; then
            TAGS="${TAGS}
          ${IMAGE}:${GITHUB_REF_NAME}"
          fi
          {
            echo "list<<TAGEOF"
            echo "$TAGS"
            echo "TAGEOF"
          } >> "$GITHUB_OUTPUT"

      # Tags: the full git SHA (immutable — this is the artifact identity the
      # rollback runbook promotes/demotes by) plus, only on a push to main, a
      # moving tag for the branch (always `main`, since pushing is main-only
      # for now).
      - name: Build image (push only on a main push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: ${{ env.SHOULD_PUSH == 'true' }}
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
