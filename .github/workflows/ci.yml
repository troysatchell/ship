name: CI

# Assignment rule 4: run on every PR and every commit to the default branch.
# This is also the merge gate the ticket factory depends on — a factory PR is
# not eligible for merge until this is green.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege. Without this key the default GITHUB_TOKEN scope applies, which
# is broader than this workflow needs — it only reads, builds, tests and uploads.
permissions:
  contents: read

env:
  # Unit tests TRUNCATE 16 tables in the beforeAll of every api test file
  # (api/src/test/setup.ts). This database exists only for that purpose.
  CI_DATABASE_URL: postgresql://ship:ship_ci_password@localhost:5432/ship_ci

jobs:
  verify:
    name: typecheck · build · unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        # Pinned to 15-alpine because that is the environment the quarantine
        # baseline in audit/factory/quarantine.json was measured on. Production
        # (Render) runs pg16 — that divergence is a real gap, tracked separately,
        # and deliberately NOT papered over by silently bumping this pin.
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ship
          POSTGRES_PASSWORD: ship_ci_password
          POSTGRES_DB: ship_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # source-code inventory reports commit history depth

      # Pinned to a full commit SHA, not a tag: a mutable tag on a third-party
      # action can be repointed at malicious code without the ref changing here.
      # b906aff is the commit behind the v4 annotated tag. actions/* below are
      # GitHub-owned and are not subject to this rule.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.27.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared (api and web both depend on its dist)
        run: pnpm build:shared

      - name: Type check
        run: pnpm type-check

      # NOTE: `pnpm lint` is deliberately NOT run here. Audit finding TS-6
      # (TRO-211) established that no ESLint config exists anywhere in the repo,
      # so the script exits 0 having checked nothing. Adding it would make CI
      # report a passing quality gate that does not exist. Wire it in when
      # TRO-211 lands.

      - name: Build all packages
        run: pnpm build

      - name: Migrate CI database
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
        run: pnpm db:migrate

      # NOTE: --outputFile must be ABSOLUTE. `pnpm --filter` runs vitest with cwd
      # set to the package directory, so a relative path lands at api/api-tests.json
      # and the regression check below cannot find it.
      - name: API unit tests
        # continue-on-error mirrors the web step: without it a single api failure
        # skips every later step, so the regression check never runs and CI tells
        # you it broke but not WHICH test. The regression check below is the gate
        # for both packages — it fails the job on any new failure.
        continue-on-error: true
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          NODE_ENV: test
        run: pnpm --filter @ship/api test --reporter=json --outputFile="$GITHUB_WORKSPACE/api-tests.json"

      - name: Web unit tests
        # continue-on-error: web has 13 known failures (TEST-1 / TRO-223). The
        # regression check below is the real gate — it fails only on NEW breakage.
        continue-on-error: true
        run: pnpm --filter @ship/web test --reporter=json --outputFile="$GITHUB_WORKSPACE/web-tests.json"

      - name: Check for test regressions vs quarantine baseline
        run: |
          node scripts/factory/lib/testdiff.mjs \
            --package api --current api-tests.json \
            --baseline audit/factory/quarantine.json --repo-root "$PWD"
          node scripts/factory/lib/testdiff.mjs \
            --package web --current web-tests.json \
            --baseline audit/factory/quarantine.json --repo-root "$PWD"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.sha }}
          path: |
            api-tests.json
            web-tests.json
          retention-days: 14

  inventory:
    name: source-code inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pinned to a full commit SHA, not a tag: a mutable tag on a third-party
      # action can be repointed at malicious code without the ref changing here.
      # b906aff is the commit behind the v4 annotated tag. actions/* below are
      # GitHub-owned and are not subject to this rule.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.27.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Assignment rule 4 requires the pipeline to produce an inventory of the
      # source code it built. Tagged with the git SHA so an artifact can always
      # be traced back to the exact tree that produced it (rule 5).
      - name: Generate inventory
        run: |
          set -euo pipefail
          mkdir -p inventory
          {
            echo "# Source-code inventory"
            echo
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- ref: \`${GITHUB_REF}\`"
            echo "- built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- total commits: $(git rev-list --count HEAD)"
            echo
            echo "## Source files by package"
            echo
            echo "| Package | Files | Lines |"
            echo "|---|---:|---:|"
            for p in api web shared e2e; do
              [ -d "$p" ] || continue
              # `grep` exits 1 on zero matches, which aborts the whole step under
              # `set -e -o pipefail`. `xargs -r` avoids wc reading stdin when the
              # list is empty. A package with no source files must report 0, not
              # kill the job.
              list=$(git ls-files "$p" | grep -E '\.(ts|tsx|js|jsx|sql)$' || true)
              files=$(printf '%s' "$list" | grep -c . || true)
              lines=$(printf '%s\n' "$list" | xargs -r wc -l 2>/dev/null | tail -1 | awk '{print $1}')
              echo "| $p | ${files:-0} | ${lines:-0} |"
            done
            echo
            echo "## Direct dependencies"
            echo
            echo '```'
            pnpm list --depth 0 --recursive 2>/dev/null || true
            echo '```'
            echo
            echo "## Licenses"
            echo
            echo '```'
            pnpm licenses list --prod 2>/dev/null | head -200 || echo "(pnpm licenses unavailable)"
            echo '```'
          } > inventory/INVENTORY-${GITHUB_SHA}.md
          echo "--- generated ---"
          head -30 inventory/INVENTORY-${GITHUB_SHA}.md

      - name: Upload inventory
        uses: actions/upload-artifact@v4
        with:
          name: source-inventory-${{ github.sha }}
          path: inventory/
          retention-days: 90

  build-image:
    name: build · push image (GHCR)
    runs-on: ubuntu-latest
    # Assignment rule 5: build once, promote the artifact. This job builds the
    # SAME root Dockerfile `verify` already proved buildable-and-tested code goes
    # into (TRO-242 made the image build from source), and never rebuilds it
    # again downstream — Render is switched (TRO-246, tracked separately; see
    # docs/deployment-artifact-lifecycle.md) to deploy the exact image pushed
    # here, by digest-stable SHA tag, instead of building its own from the repo.
    # `needs: verify` so a doomed PR/commit never spends minutes on a docker
    # build, and so main never pushes an image for code that failed its own gate.
    needs: verify
    timeout-minutes: 20

    # Job-level `permissions:` REPLACES the workflow default for this job, it
    # does not add to it — so `contents: read` must be restated alongside the
    # `packages: write` this job alone needs to push to GHCR.
    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/troysatchell/ship
      # True only for an actual push to main. Never for a pull_request — even
      # one opened against main — and never for a workflow_dispatch run against
      # some other branch. PR runs still build (below), unauthenticated and
      # without pushing, to prove the Dockerfile a change touched stays
      # buildable from a clean checkout; that's the whole value of this job
      # running on PRs at all, since nothing there is promoted anywhere.
      SHOULD_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Only authenticate when we're actually about to push. A fork PR's
      # GITHUB_TOKEN has no write scope regardless of the permissions block
      # above (GitHub enforces that for forked-repo runs), so this would fail
      # there anyway — skipping it is also what keeps a PR run from needing
      # any registry credential at all.
      - name: Log in to GHCR
        if: env.SHOULD_PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: the full git SHA (immutable — this is the artifact identity the
      # rollback runbook promotes/demotes by) plus a moving tag for the branch
      # (`main` on every push there, since pushing is main-only for now).
      - name: Build image (push only on a main push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: ${{ env.SHOULD_PUSH == 'true' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
