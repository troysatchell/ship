  # ───────────────────────── return paths ─────────────────────────────
  - id: f01
    from: api_collab
    to: web_editor
    kind: feedback
    label: Yjs sync + awareness
    polarity: '-'
    loop: B1
    views: [flow]
    note: |
      The convergence loop. Every local edit is applied optimistically, sent as a
      Yjs update, merged server-side and rebroadcast to the other clients in the
      room. Corrective, and it settles — CRDT merge is commutative, so the
      replicas agree regardless of arrival order.
  - id: f02
    from: api_collab
    to: web_hooks
    kind: feedback
    label: /events push
    polarity: '-'
    loop: B2
    views: [flow]
    note: |
      broadcastToUser -> the /events socket -> query invalidation -> refetch.
      Corrective: it pulls the client cache back toward server truth after a
      mutation someone else made.
  - id: f03
    from: api_mw
    to: web_apiclient
    kind: feedback
    label: 401 SESSION_EXPIRED
    polarity: '-'
    loop: B3
    views: [flow]
    note: |
      15-minute inactivity window, 12-hour absolute cap. lib/api.ts turns
      SESSION_EXPIRED into a redirect to /login with returnTo, but deliberately
      not a plain UNAUTHORIZED.
  - id: f04
    from: web_idb
    to: web_query
    kind: feedback
    label: corruption -> clear + reload
    polarity: '-'
    loop: B4
    views: [flow]
    note: |
      The persister validates the schema version and the restored shape on read.
      On failure CacheCorruptionAlert offers clearAllCacheData() followed by
      window.location.reload(). One of the few loops in this system that a human
      has to close by clicking.

  # ────────────────────────────── gaps ────────────────────────────────
  - id: g01
    from: api_collab
    to: redis
    kind: gap
    label: no cross-instance room sync
    views: [flow]
    note: |
      DERIVED, not observed. Three observed facts: the Yjs `docs` and `awareness`
      Maps are process-local (collaboration/index.ts:95-130); Redis has no
      consumer other than the rate limiters (grep REDIS_URL -> app.ts,
      rate-limit.ts, redis-rate-limit-store.ts, ssm.ts); the ASG scales to 4
      instances.

      The consequence I have NOT run: above one instance, two people editing the
      same document can be routed to different processes, each holding its own
      Y.Doc for that room and persisting over the other every 2s. Session
      stickiness does not address this either way — it pins a browser to an
      instance, not a document to an instance, so two different users on the same
      document can still land on two different rooms. To confirm or kill this,
      run two instances behind the ALB and open one document as two users.
  - id: g02
    from: api_app
    to: redis
    kind: gap
    label: CSRF store is in-process
    views: [flow]
    note: |
      DERIVED from an observed fact: `app.use(session({...}))` at app.ts:335-345
      passes no `store`, so express-session uses the default MemoryStore, and
      csrf-sync keeps the CSRF secret in that session. A token minted by
      `/api/csrf-token` on one instance therefore has no matching secret on
      another.

      How much this bites depends on the stickiness question in the Elastic
      Beanstalk note. With stickiness on, a browser keeps hitting the same
      instance and this mostly does not surface — until that instance is replaced
      by a deploy or a scale-in, at which point every in-flight CSRF secret is
      gone. With it off, it surfaces as intermittent 403s under load. Neither
      case is reproduced here. Application auth is unaffected either way: that is
      a real `sessions` table in Postgres, not express-session.

