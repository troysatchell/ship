findings:
  - id: manual-1
    severity: medium
    kind: boundary-not-modelled
    title: Nodes are directories, so intra-directory coupling is invisible
    nodes: [api_routes, web_components]
    detail: |
      Every node here is a folder, not a file. routes/ (23k lines) and
      components/ (19k lines) are drawn as single boxes, so the coupling *inside*
      them — the part most likely to hurt — does not appear. The measured import
      counts on each edge are cross-directory only; imports within a directory
      were dropped during aggregation. For file-level detail, re-extract with
      dependency-cruiser scoped to one directory.
  - id: manual-2
    severity: medium
    kind: runtime-dependency-not-static
    title: The MCP tool surface is not derivable from this repository
    nodes: [api_mcp]
    detail: |
      mcp/server.ts has no import edge into the rest of the codebase — it builds
      its tools by fetching /api/openapi.json from whatever SHIP_URL points at,
      at startup. So its behaviour is a property of a deployment, not of a
      commit, and it silently tracks whichever environment the operator
      configured. The edge into CloudFront is marked heuristic for that reason.
  - id: manual-3
    severity: low
    kind: test-config-masking
    title: A smoke test can pass by skipping the code that breaks
    nodes: [api_config]
    detail: |
      config/ssm.ts returns early unless NODE_ENV=production (ssm.ts:39). A
      container smoke test run under development therefore never exercises secret
      loading, and has previously been reported as end-to-end verification when
      it was the opposite. Any claim about boot correctness has to state the
      NODE_ENV it ran under.
