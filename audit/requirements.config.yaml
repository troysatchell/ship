# requirements-audit per-repo config
# Written by `/requirements-audit init` 2026-08-08 — hand-edit freely; the skill re-reads it every run.
# The skill hardcodes nothing repo-specific: if a fact about this repo matters, it lives here.

docs:
  # `id` prefixes requirement IDs (W4 -> W4-R12). `sha256` is filled at extraction;
  # a later mismatch stops the sweep and offers re-extraction.
  - id: W4
    path: "project guideliens/GFA_Week_4_ShipShape_Updated.pdf"
    sha256: d385bcc4af6341956c532b6ae558c9405de77f46bb14301fd4bda3e35e3af311

tickets:
  provider: linear
  team: TRO
  project: null

# Roots searched during the trace phase. Application source alone is not enough for
# this document set: the W4 brief's acceptance evidence lives largely in audit
# artifacts, CI config, IaC, and repo-root docs, so those are evidence roots too.
code_roots:
  - api/src
  - web/src
  - shared/src
  - audit                 # AUDIT_REPORT.md + per-category baseline/compare artifacts
  - terraform             # Category 8 (Terraform) evidence
  - .github               # CI workflow evidence
  - scripts               # one-command start, deploy scripts
  - docs                  # dev docs, improvement + submission docs
  - e2e                   # Playwright specs cited as regression-test evidence
  - .                     # repo-root files only (CHANGES.md, README.md, start.sh, package.json)
exclude:
  - node_modules
  - dist
  - build
  - coverage
  - test-results
  - .git
  - audit/requirements    # the skill's own output — never cite it as evidence

# Gaps handoff target after each sweep (invoked via the Skill tool).
pm_skill: ship-pm

# Mechanical PDF text backend (bundled pdf-inspector wrapper): extract caches
# text to audit/requirements/source-<docID>.md and verifies every Quote against it.
pdf_tool: "node ~/.claude/skills/requirements-audit/scripts/pdf/pdf2md.mjs"

# Commands available for behavioral verification; keys are labels the inventory's
# "Acceptance evidence" field references; values run from the repo root.
verify:
  # Root `test` runs api + web + agent (package.json:test = test:api && test:web && test:agent),
  # not @ship/api alone. It needs DATABASE_URL exported (`set -a; . ./api/.env.local; set +a`) —
  # without it all 77 api files fail on "DATABASE_URL must be set", which looks like a suite
  # failure but is an unset env var. Never read its exit code through a pipe: `pnpm test | tail`
  # reports tail's status (0) and hides a real failure.
  test: "pnpm test"
  webtest: "pnpm --filter @ship/web test"
  e2e: "pnpm test:e2e"                    # Playwright, per-worker Postgres testcontainers — heavy, needs Docker
  typecheck: "pnpm type-check"
verify_urls:
  app: "http://localhost:5173"            # WEB port per repo-root .ports; API port floats — always read .ports, never assume 3000
