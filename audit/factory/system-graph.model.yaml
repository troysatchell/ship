findings:
  - id: manual-1
    severity: high
    kind: prompt-side-invariant
    title: The regression-test gate is satisfiable by a test that never runs
    nodes: [gate]
    detail: G6 requires an added test case anywhere in the diff; whether the
      gate's own suites execute that file is enforced only by the ship-qa
      placement rule carried in every brief. Both skills state this openly —
      it is the known soft spot of the evidence gate, and the reason the rule
      is injected into every brief regardless of ticket category.
  - id: manual-2
    severity: medium
    kind: single-point-of-serialisation
    title: One Postgres container bounds the whole factory's concurrency
    nodes: [pg]
    detail: Databases isolate correctness, but every gate's test run shares
      ship-audit-pg's connection limit and CPU — beyond a handful of
      simultaneous gates, test timings stop being comparable. Playwright
      sizing from free memory alongside gate runs once produced a 90GB
      over-subscription and a system crash. Dispatch is broad; gates stagger.
  - id: manual-3
    severity: medium
    kind: manual-refresh
    title: The shared board artifact only refreshes via an agent tool call
    nodes: [surfaces]
    detail: serve.mjs/status.mjs are free and always current; the published
      Artifact is a milestone snapshot because a shell script cannot republish
      it. The mitigation is labelling, not automation — the board says it is a
      snapshot.
  - id: manual-4
    severity: low
    kind: shared-external-dependency
    title: CodeRabbit CLI is unbounded and its allowance is shared
    nodes: [coderabbit]
    detail: The CLI has no internal deadline (observed 11+ min wall against
      2.6s CPU under concurrent worktrees) and its free allowance exhausts,
      returning a JSON error stub. G9 mitigates both — hard timeout, and never
      promoting a stub over a completed review — but the PR-level review
      remains the authoritative fallback.
