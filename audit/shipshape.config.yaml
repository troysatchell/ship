notes:
  - "TYPE-SAFETY lead: web/tsconfig.json does NOT extend root — silently missing noUncheckedIndexedAccess, noImplicitReturns, noFallthroughCasesInSwitch that api/shared inherit. Root strict: true everywhere."
  - "BUNDLE lead: no analyzer, no manualChunks; code splitting exists only for document tabs (13 React.lazy in web/src/lib/document-tabs.tsx) — no route-level splitting."
  - "TEST lead: api vitest.config declares v8 coverage + test:coverage script, but @vitest/coverage-v8 is NOT installed (absent from pnpm-lock) — coverage is currently broken. Web vitest has no coverage block. Root pnpm test skips web unit tests (16 files)."
  - "DB lead: no index on documents.ticket_number, created_by, or updated_at. Associations moved to document_associations (migrations 027/029). GIN index exists on properties."
  - "A11Y head start: e2e/accessibility.spec.ts + accessibility-remediation.spec.ts use @axe-core/playwright (8 AxeBuilder scans, WCAG-numbered phases). Run these before independent scanning."
  - "E2E: retries configured (2 CI / 1 local) — flakiness audit must record first-attempt outcomes. playwright.config comment says 641 tests, actual ~866 — count drifted."
  - "Dev quirk: e2e uses vite preview, not dev server (documented memory blowup with dev). Multi-worktree port allocation via .ports file."
