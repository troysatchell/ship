# ShipShape per-project audit config for Ship
# Read by all shipshape category audit skills. Facts verified against the repo 2026-07-27.

project:
  name: ship
  repoRoot: /Users/troy/repos/GAUNTLET/Ship
  packageManager: pnpm
  packages:
    - path: web
      role: frontend
    - path: api
      role: backend
    - path: shared
      role: shared

commands:
  install: pnpm install
  buildWeb: pnpm build:web          # runs build:shared first; web build = tsc && vite build
  buildAll: pnpm build
  typecheck: pnpm type-check
  test: pnpm test                    # NOTE: root test runs ONLY @ship/api vitest; web has its own `pnpm --filter @ship/web test`
  testE2e: pnpm test:e2e             # Playwright, 71 spec files / ~866 tests; per-worker Postgres testcontainers + vite preview — heavy, needs Docker
  dev: pnpm dev                      # scripts/dev.sh — auto-creates DB, migrates, seeds, picks free ports, writes .ports file
  dbSeed: pnpm db:seed               # api/src/db/seed.ts — idempotent; see seed: notes below
  dbMigrate: pnpm db:migrate

urls:
  web: http://localhost:5173         # VERIFIED 2026-07-27, this run
  api: http://localhost:3001         # VERIFIED 2026-07-27: :3000 is occupied by an unrelated
                                     # `open-webui` container, so dev.sh fell through to 3001.
                                     # ALWAYS read repo-root .ports rather than assuming 3000.
  loginDev: dev@ship.local / admin123  # seeded super-admin (all seeded users use admin123)
  auth: >                            # VERIFIED working sequence — login 403s without this
    1. GET /api/csrf-token  -> {"token": "..."}   (field is `token`, NOT `csrfToken`)
    2. POST /api/auth/login with header `x-csrf-token: <token>`, same cookie jar,
       body {"email":"dev@ship.local","password":"admin123"}
    3. Reuse that cookie jar for all subsequent requests.
    Bearer-token requests skip CSRF entirely (api/src/app.ts:52).

database:
  kind: postgres
  # VERIFIED 2026-07-27: there is NO local PostgreSQL on this machine (no psql/pg_isready
  # on PATH) despite CLAUDE.md's claim. This audit runs against a Docker container:
  #   docker run -d --name ship-audit-pg -e POSTGRES_DB=ship_dev -e POSTGRES_USER=ship \
  #     -e POSTGRES_PASSWORD=ship_dev_password -p 5433:5432 postgres:15-alpine
  # docker-compose.local.yml declares postgres:16, but registry pulls are blocked in this
  # environment and only postgres:15-alpine was cached. Version skew is recorded in every
  # artifact's environment.scaffolding — it matters for EXPLAIN plan comparisons.
  connection: postgresql://ship:ship_dev_password@localhost:5433/ship_dev
  queryLogging: >
    Local PG: ALTER SYSTEM SET log_statement='all'; ALTER SYSTEM SET log_min_duration_statement=0; SELECT pg_reload_conf();
    Docker (compose.local): add command: ["postgres","-c","log_statement=all","-c","log_min_duration_statement=0"] to the postgres service.
    Revert after db-query audit.
  schema: api/src/db/schema.sql      # unified `documents` table ("EVERYTHING IS A DOCUMENT"), 38 migrations in api/src/db/migrations/
  dbLayer: raw pg Pool (api/src/db/client.ts) — inline parameterized SQL in route files, no ORM

seed:                                # brief-required minimums
  documents: 500
  issues: 100
  users: 20
  sprints: 10
  # VERIFIED 2026-07-27 — `pnpm db:seed` alone yields 257 documents / 11 users, i.e. it
  # MISSES the documents and users targets. audit/seed-augment.ts (written for this audit)
  # tops the dataset up deterministically. Required setup order:
  #   pnpm db:migrate  &&  pnpm db:seed  &&  ./api/node_modules/.bin/tsx audit/seed-augment.ts
  # (`tsx` is not on PATH; use the workspace-local binary shown above.)
  actual:                            # measured after augmentation — the audited data volume
    documents: 500                   # issue 254, wiki 91, sprint 35, weekly_plan 32,
                                     # weekly_retro 27, person 20, weekly_review 15,
                                     # project 15, standup 6, program 5
    users: 20
    sprints: 35
  verify: docker exec ship-audit-pg psql -U ship -d ship_dev -c "SELECT document_type, count(*) FROM documents GROUP BY 1 ORDER BY 2 DESC;"

# CONFIRMED 2026-07-27 by api-perf-audit (baseline) — replaces the earlier provisional list.
# Method: headless Chromium (repo Playwright 1.57.0) logged in as dev@ship.local, ran every
# `userFlows` entry, recorded all /api/* requests. Raw trace: audit/api-perf/raw/frontend-trace.json.
# Selection = frequency x user-visibility across the 8 traced flows (63 requests / 49 unique).
# Benchmarked with a session cookie (see auth: above) via autocannon 8.0.0.
keyEndpoints:
  - method: GET
    path: /api/documents?type=wiki
    flow: App shell wiki sidebar — fires on every cold page load (5 of 8 flows); 37.9 KB
  - method: GET
    path: /api/issues
    flow: Issues list / app boot — largest payload at 380 KB, no pagination
  - method: GET
    path: /api/documents
    flow: Unfiltered doc list (global search / doc picker) — 294 KB, all 500 docs
  - method: GET
    path: /api/documents/:id
    flow: View a document — 1 KB; control for per-request auth overhead
  - method: GET
    path: /api/team/assignments
    flow: Sprint board (/team/allocation, where /sprints redirects) — 22.7 KB
  - method: GET
    path: /api/weeks
    flow: Dashboard week list — 4.4 KB; parent of the per-week standups fan-out (API-4)
# NOT confirmed, removed from the provisional list:
#   /api/search?q=...  — no such route is reachable from the UI. `/api/search` exists but the
#                        only frontend caller is /api/search/mentions (editor @-autocomplete,
#                        web/src/components/editor/MentionExtension.ts:23). The UI's document
#                        search filters client-side over the full GET /api/documents payload.
#   /api/dashboard     — not a route; the real endpoints are /api/dashboard/my-week and
#                        /api/dashboard/my-focus (both small, 1.2-2.9 KB).

keyPages:
  - name: Dashboard / main page
    url: /
  - name: Document view (wiki doc)
    url: /documents/<seeded doc id>
  - name: Issues list
    url: /issues
  - name: Sprint / week board
    url: /weeks
  - name: Search
    url: /search

userFlows:
  - "Load main page"
  - "View a document"
  - "List issues"
  - "Load sprint board"
  - "Search content"

# Live status dashboard — regenerated + republished by the orchestrator at each
# checkpoint (see "Live dashboard" in shipshape-audit SKILL.md). The url targets the
# existing artifact so every republish keeps the same link.
dashboard:
  file: audit/dashboard.html
  url: https://claude.ai/code/artifact/7a2310eb-6cce-4da6-a83f-5c5b8d3f2c6c
  favicon: "🩺"

bundle:
  distDir: web/dist
  analyzer: rollup-plugin-visualizer   # not yet installed; no manualChunks/rollupOptions configured in web/vite.config.ts
apiPerf:
  loadTool: autocannon
  concurrency: [10, 25, 50]
  auth: >
    POST /api/auth/login {email: dev@ship.local, password: admin123} — capture session
    cookie for benchmark requests. Login is rate-limited (loginLimiter): authenticate
    once, reuse the cookie. CSRF middleware (csrf-sync) guards mutations; benchmark GETs
    with the cookie, or fetch a CSRF token first for POST benchmarks.

