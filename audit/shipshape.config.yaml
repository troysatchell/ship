# Prerequisite-gate finding, handed to db-query-audit for confirmation and ID assignment.
# Severity: Critical. Discovered while bringing the database up for this audit.
preflightFindings:
  - title: "pnpm db:migrate silently skips 32 of 42 migrations and exits 0"
    location: "api/src/db/migrate.ts:103-111"
    evidence: >
      On a fresh database, migrate.ts applies schema.sql first (which already contains the
      END-STATE schema), then replays migrations from 001. Migration 010_oauth_state.sql runs
      `CREATE TABLE oauth_state` WITHOUT `IF NOT EXISTS`, but schema.sql:90 already created that
      table — so it throws `relation "oauth_state" already exists`. The catch block treats ANY
      error whose message contains "already exists" as benign, logs "Database schema already
      exists, continuing...", and returns normally. The loop is abandoned: migrations 011-042
      never run and are never recorded. Verified: schema_migrations held 10 rows after two
      successive `pnpm db:migrate` runs that both reported success; 42 migration files exist.
      Applying them individually also surfaced 025 and 035 failing the same benign way, and
      033_sprint_to_week_rename failing with `"sprint_plan" is not an existing enum label`.
    hypothesis: >
      The "already exists" escape hatch was written for schema.sql re-runs (step 1) but wraps
      the entire function including the migration loop (step 4), so a single non-idempotent
      migration silently truncates the whole sequence. A fresh dev DB still looks correct
      because schema.sql carries the end state — which is exactly why this has gone unnoticed.
    estimatedImpact: >
      On any database that is NOT already at the end state (a real deploy against an older
      prod/shadow DB), deploys report migration success while silently skipping data backfills
      and schema changes not present in schema.sql. Migrations run automatically on deploy
      (api/src/db/migrate.ts, per CLAUDE.md), so this is a live data-integrity risk.

